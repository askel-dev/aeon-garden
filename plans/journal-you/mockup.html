<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal: You tab</title>
<!-- A mockup, not the game: the recipe book with a third part, You (the skills, the body, the days), and the parts that
     could come after it. The book's own CSS (index.html #book) copied in and cut down; nothing here is wired to game.js. -->
<style>
  @font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 450; src: url(../../assets/fonts/fraunces-italic-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 600 680; src: url(../../assets/fonts/fraunces-normal-latin.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito'; font-style: normal; font-weight: 500 900; src: url(../../assets/fonts/nunito-normal-latin.woff2) format('woff2'); }
  :root {
    --card: #f8f0de; --ink: #3b372f; --muted: #6f6657; --line: #ecdfc8;
    --accent: #e98a4b; --accent-ink: #9e4a17; --accent-soft: #fde4cf; --good-ink: #43762c;
    --hand: #33406b;   /* the forager's pencil: what's written in by hand */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: Nunito, ui-rounded, system-ui, sans-serif; color: var(--ink); font-size: 14px; background: #9cc77e;
    background-image: radial-gradient(ellipse 40% 30% at 18% 25%, #b5d58f 0 60%, transparent 61%), radial-gradient(ellipse 30% 22% at 80% 70%, #8bbd6c 0 60%, transparent 61%),
      radial-gradient(ellipse 22% 14% at 70% 18%, #6fa6c9 0 70%, transparent 71%), radial-gradient(circle at 30% 80%, #a9cf86 0 18%, transparent 19%); }
  .scrim { position: fixed; inset: 0; background: rgba(40, 32, 18, 0.32); }
  .fr { font-family: Fraunces, Georgia, serif; }

  /* the mockup's own switcher, not part of the design */
  .concepts { position: relative; z-index: 20; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 14px 16px 0; }
  .concepts button { font: 800 12.5px Nunito, sans-serif; color: var(--ink); padding: 7px 13px; border: none; border-radius: 99px; cursor: pointer;
    background: var(--card); box-shadow: inset 0 0 0 1px rgba(150, 115, 60, 0.22), 0 2px 6px rgba(50, 40, 15, 0.2); }
  .concepts button.on { background: #3b372f; color: #f8f0de; }
  .concepts .soon { opacity: 0.85; }
  .concepts .soon::after { content: ' · later'; font-weight: 700; opacity: 0.65; }
  .note { position: relative; z-index: 20; max-width: 880px; margin: 10px auto 0; padding: 0 16px; text-align: center; color: #23331a; font-weight: 700; font-size: 13px; }

  .stage { position: relative; z-index: 10; display: grid; place-items: center; padding: 34px 16px 40px; }

  /* the book */
  .book { position: relative; width: min(880px, 100%); height: 600px; color: var(--ink);
    display: grid; grid-template-columns: 1.05fr 1fr; border-radius: 18px; background: var(--card);
    box-shadow: 0 20px 60px rgba(50, 40, 15, 0.35), inset 0 0 0 1px rgba(150, 115, 60, 0.22), inset 0 0 0 5px rgba(201, 154, 76, 0.18); }
  .book::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; z-index: 3; border-radius: 18px 18px 0 0;
    background: linear-gradient(180deg, #f1d48a, #c99a4c 60%, #a8742a); box-shadow: 0 1px 0 rgba(120, 80, 20, 0.35); }
  .left, .right { position: relative; min-height: 0; overflow: hidden auto; scrollbar-width: none; }
  .left { padding: 22px 20px 18px 24px; background: linear-gradient(90deg, transparent 88%, rgba(120, 85, 30, 0.10)); border-radius: 18px 0 0 18px; }
  .right { padding: 26px 26px 18px; background: linear-gradient(90deg, rgba(120, 85, 30, 0.16), transparent 9%); border-radius: 0 18px 18px 0; }
  .bb { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: none; border-radius: 50%; cursor: pointer; font-size: 16px; color: var(--ink);
    background: linear-gradient(180deg, #fffaf0, #f1e5c9); box-shadow: inset 0 0 0 1.5px #d2b06a, 0 2px 0 #a8742a; }
  .b-x { position: absolute; top: 14px; right: 14px; z-index: 4; }

  /* NEW: the parts as cloth ribbons over the book's top edge (as The Forest's tabs), each with its mark; the open one
     stands taller and joins the page. Three now; the faint ones are what could come. */
  .ribbons { position: absolute; left: 22px; right: 80px; top: -30px; height: 34px; display: flex; gap: 5px; z-index: 2; }
  .rb { position: relative; display: flex; align-items: center; gap: 6px; height: 30px; margin-top: 4px; padding: 0 11px 4px; border: none; border-radius: 9px 9px 0 0;
    font: 850 12px Nunito, sans-serif; color: #fff8ea; cursor: pointer; background: var(--c); box-shadow: inset 0 -6px 6px -4px rgba(40, 20, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
  .rb svg { width: 15px; height: 15px; flex: none; }
  .rb.on { height: 34px; margin-top: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4); }
  .rb.later { opacity: 0.5; filter: saturate(0.4); }
  .rb.new::after { content: ''; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: #c4562a; box-shadow: 0 0 0 2px var(--card); }

  .b-head { display: flex; align-items: baseline; gap: 12px; }
  .b-head h2 { margin: 0; font-size: 26px; font-weight: 650; }
  .b-head .n { margin-left: auto; font-weight: 900; font-size: 15px; color: var(--muted); }
  h3.sec { display: flex; align-items: baseline; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: 0.11em; font-size: 12px; font-weight: 900; color: #8a5e22; }
  h3.sec span { margin-left: auto; letter-spacing: 0; font-size: 12.5px; color: var(--muted); text-transform: none; font-weight: 800; }
  .rule { border: none; border-top: 1px dashed #dcc9a4; margin: 14px 0 0; }

  /* handwriting: what the forager's pencil fills in (Fraunces italic in a pencil blue, as The Forest's marker) */
  .hand { font-family: Fraunces, Georgia, serif; font-style: italic; font-weight: 450; color: var(--hand); }

  /* the You sheet */
  .who { display: grid; grid-template-columns: 84px 1fr; gap: 14px; align-items: center; margin-top: 12px; }
  .face { width: 84px; height: 84px; border-radius: 50%; background: #efe3c8; box-shadow: inset 0 0 0 2px #b98a45, 0 2px 0 #a8742a; overflow: hidden; }
  .lines { display: grid; gap: 3px; }
  .ln { display: flex; align-items: baseline; gap: 10px; font-size: 11.5px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #8a5e22; }
  .ln .hand { font-size: 21px; letter-spacing: 0; text-transform: none; line-height: 1.1; }
  .ln .hand.big { font-size: 26px; position: relative; }
  .ln .hand.big::after { content: ''; position: absolute; left: -4px; right: -6px; bottom: 1px; height: 7px; border-radius: 50%; border-bottom: 2px solid rgba(51, 64, 107, 0.45); transform: rotate(-2deg); }

  .vit { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 18px; margin-top: 4px; }
  .v-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #8a5e22; }
  .v-top b { font: 450 italic 15px Fraunces, Georgia, serif; letter-spacing: 0; text-transform: none; color: var(--hand); }
  .bar { position: relative; height: 7px; margin-top: 4px; border-radius: 99px; background: #e6d7b8; box-shadow: inset 0 1px 1px rgba(80, 60, 30, 0.25); }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--c); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 800; background: rgba(150, 115, 60, 0.1); color: var(--muted); }
  .chip.warm { background: var(--accent-soft); color: var(--accent-ink); }
  .chip.wet { background: #dde8f1; color: #355a7a; }
  .chip.good { background: #e3efd4; color: var(--good-ink); }

  /* skill rows (left page): a coin, the name, the bar; the one open marked as a recipe tile is */
  .skills { display: grid; gap: 7px; }
  .sk { display: grid; grid-template-columns: 46px 1fr; gap: 11px; align-items: center; width: 100%; padding: 7px 10px 8px 7px; border: none; border-radius: 12px; text-align: left;
    font: inherit; color: inherit; cursor: pointer; background: rgba(255, 250, 238, 0.55); box-shadow: inset 0 0 0 1px rgba(150, 115, 60, 0.2); }
  .sk:hover { background: rgba(255, 250, 238, 0.95); }
  .sk.on { background: #fff6e4; box-shadow: inset 0 0 0 2px #d9a441, 0 2px 0 #a8742a; }
  .sk-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .sk-top b { font-size: 15px; font-weight: 850; }
  .sk-top span { font-size: 12px; font-weight: 800; color: var(--muted); }
  .sk small { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--muted); line-height: 1.3; }
  .sk.locked { cursor: default; background: none; box-shadow: none; border: 1.5px dashed rgba(150, 115, 60, 0.3); }
  .sk.locked b { color: #9c8a66; }
  .sk.locked .coin { filter: grayscale(1) brightness(1.1); opacity: 0.45; }

  /* the level coin, as the level up's (LEVEL_COIN) */
  .coin { position: relative; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; color: var(--ink2);
    font: 650 20px/1 Fraunces, Georgia, serif; background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--coin) 40%, #fff) 0 18%, var(--coin) 52%, color-mix(in srgb, var(--coin) 70%, #2c1a06) 100%);
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--coin) 60%, #2c1a06), inset 0 0 0 4px color-mix(in srgb, var(--coin) 75%, #fff), 0 2px 0 color-mix(in srgb, var(--coin) 55%, #2c1a06); }
  .coin.max { background: conic-gradient(from 20deg, #f6d6e2, #f3e8b8, #cfeccf, #c9def5, #e2d2f3, #f6d6e2); box-shadow: inset 0 0 0 2px #b9a37a, inset 0 0 0 4px #fff7e2, 0 0 14px rgba(255, 230, 170, 0.9); }
  .coin.big { width: 112px; height: 112px; font-size: 50px; }

  /* a skill's page (right) */
  .pg-no { text-transform: uppercase; letter-spacing: 0.11em; font-size: 12px; font-weight: 900; color: #8a5e22; padding-right: 50px; }
  .pg-no + p.say { padding-right: 44px; }
  .plate { position: relative; display: grid; place-items: center; height: 150px; margin: 4px 0 2px; }
  .plate::before { content: ''; position: absolute; left: 50%; top: 50%; width: 190px; height: 70px; margin: 18px 0 0 -95px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(120, 85, 30, 0.22), transparent 70%); }
  .plate::after { content: ''; position: absolute; inset: 10px 25%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 235, 170, 0.6), transparent 65%); z-index: 0; }
  .plate .coin { z-index: 1; }
  .right h3 { margin: 0; font-size: 28px; font-weight: 650; line-height: 1.15; }
  .right p.say { margin: 4px 0 10px; font: 450 italic 17px/1.4 Fraunces, Georgia, serif; }
  .right p { margin: 4px 0 8px; font-size: 14px; line-height: 1.45; font-weight: 700; color: var(--muted); }
  .right h4 { margin: 14px 0 7px; padding-top: 10px; border-top: 1px dashed var(--line); text-transform: uppercase; letter-spacing: 0.11em; font-size: 12px; font-weight: 900; color: #8a5e22; }
  .prog { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 800; color: var(--muted); margin-top: 6px; }

  /* the road: a pip a level, 1 to 10, each in its own metal, with what it opens under it */
  .road { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; align-items: start; }
  .step { display: grid; justify-items: center; gap: 4px; text-align: center; }
  .pip { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 650 12px Fraunces, Georgia, serif; color: var(--ink2);
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--coin) 40%, #fff), var(--coin) 70%); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--coin) 60%, #2c1a06); }
  .step.ahead .pip { background: #efe3c8; color: #a8916a; box-shadow: inset 0 0 0 1.5px rgba(150, 115, 60, 0.3); }
  .step.here .pip { outline: 2.5px solid #d9a441; outline-offset: 2px; }
  .step em { font-style: normal; font-size: 10.5px; font-weight: 800; line-height: 1.15; color: #8a5e22; }
  .step.ahead em { color: #a8916a; }
  .perks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .perks li { display: flex; justify-content: space-between; align-items: center; min-height: 34px; padding: 4px 12px; border-radius: 10px; font-size: 14px; font-weight: 800; background: rgba(120, 95, 50, 0.05); }
  .perks li b { color: var(--good-ink); font-variant-numeric: tabular-nums; }
  .perks li small { color: var(--muted); font-weight: 700; }

  /* the almanac (later): records in pencil, ribbons as stamps */
  .rec { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: baseline; }
  .rec dt { font-size: 11.5px; font-weight: 900; letter-spacing: 0.1em; text-transform: uppercase; color: #8a5e22; }
  .rec dd { margin: 0; font: 450 italic 19px Fraunces, Georgia, serif; color: var(--hand); text-align: right; }
  .stamps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 6px; }
  .stp { display: grid; place-items: center; gap: 2px; aspect-ratio: 1; padding: 6px; border-radius: 50%; text-align: center; transform: rotate(var(--r, -6deg));
    border: 2.5px solid var(--sc, #b8432a); color: var(--sc, #b8432a); box-shadow: inset 0 0 0 4px var(--card), inset 0 0 0 5.5px color-mix(in srgb, var(--sc, #b8432a) 45%, transparent); }
  .stp b { font: 600 13px/1.1 Fraunces, Georgia, serif; }
  .stp small { font-size: 10px; font-weight: 800; opacity: 0.8; }
  .stp.not { border-style: dashed; color: #b6a27c; border-color: #cdb991; box-shadow: none; transform: none; }

  /* the diary (later) */
  .entry { margin: 0 0 14px; }
  .entry .d { text-transform: uppercase; letter-spacing: 0.11em; font-size: 11.5px; font-weight: 900; color: #8a5e22; }
  .entry p { margin: 3px 0 0; font: 450 italic 17px/1.5 Fraunces, Georgia, serif; color: var(--hand);
    background-image: repeating-linear-gradient(transparent 0 24.5px, rgba(110, 140, 190, 0.22) 24.5px 25.5px); background-position: 0 1px; }
  .doodle { float: right; margin: 0 0 6px 10px; }
  .pressed { position: absolute; right: 26px; bottom: 30px; transform: rotate(14deg); opacity: 0.9; }
  .tape { position: absolute; width: 46px; height: 14px; background: rgba(240, 225, 180, 0.8); box-shadow: 0 1px 2px rgba(80, 60, 30, 0.2); }

  /* the bestiary (later) */
  .beasts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .beast { display: grid; justify-items: center; gap: 2px; padding: 10px 4px 8px; border-radius: 12px; background: rgba(255, 250, 238, 0.55); box-shadow: inset 0 0 0 1px rgba(150, 115, 60, 0.2); font-size: 12px; font-weight: 800; }
  .beast.on { background: #fff6e4; box-shadow: inset 0 0 0 2px #d9a441, 0 2px 0 #a8742a; }
  .beast.unseen { background: rgba(120, 95, 50, 0.07); color: #9c8a66; letter-spacing: 0.15em; }
  .beast.unseen svg { filter: brightness(0); opacity: 0.16; }
  .tally { display: flex; gap: 3px; justify-content: center; }
  .tally i { width: 6px; height: 6px; border-radius: 50%; background: #e6d7b8; }
  .tally i.on { background: #8a5e22; }

  /* a phone: the book is a sheet from the bottom, ✕ at the foot, the ribbons a row across the top of the sheet */
  .phone { width: 390px; height: 800px; border-radius: 48px; padding: 12px; background: #1d1b18; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); }
  .screen { position: relative; height: 100%; border-radius: 38px; overflow: hidden; background: #9cc77e;
    background-image: radial-gradient(ellipse 60% 25% at 30% 20%, #b5d58f 0 60%, transparent 61%), radial-gradient(ellipse 40% 18% at 80% 40%, #6fa6c9 0 70%, transparent 71%); }
  .screen .scrim { position: absolute; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 84%; display: flex; flex-direction: column; border-radius: 22px 22px 0 0; background: var(--card);
    box-shadow: 0 -10px 40px rgba(50, 40, 15, 0.3), inset 0 0 0 1px rgba(150, 115, 60, 0.22); }
  .sheet .grab { width: 44px; height: 5px; margin: 8px auto 0; border-radius: 99px; background: #d6c29b; flex: none; }
  .sheet .ribbons { position: static; padding: 8px 14px 0; height: auto; gap: 4px; flex: none; }
  .sheet .rb { height: 44px; margin: 0; border-radius: 12px; padding: 0 10px; flex: 1; justify-content: center; }
  .sheet .rb span { display: none; }
  .sheet .rb.on span { display: inline; }
  .sheet .rb.on { flex: 2.4; }
  .sheet .body { flex: 1; overflow: auto; padding: 14px 18px 8px; }
  .sheet .foot { display: grid; place-items: center; padding: 8px 0 26px; flex: none; border-top: 1px dashed var(--line); }

  .hidden { display: none !important; }
  @media (max-width: 760px) {
    .book { grid-template-columns: 1fr; height: auto; }
    .left { border-radius: 18px 18px 0 0; }
    .right { border-radius: 0 0 18px 18px; border-top: 1px dashed var(--line); }
    .ribbons { left: 12px; right: 64px; }
    .rb span { display: none; }
    .rb.on span { display: inline; }
  }
</style>
</head>
<body>
<div class="scrim"></div>

<nav class="concepts" id="concepts">
  <button data-v="you" class="on">1 · You</button>
  <button data-v="skill">2 · A skill at the top</button>
  <button data-v="almanac" class="soon">3 · Almanac</button>
  <button data-v="diary" class="soon">4 · Diary</button>
  <button data-v="beasts" class="soon">5 · Bestiary</button>
  <button data-v="phone">6 · On a phone</button>
</nav>
<p class="note" id="note"></p>

<div class="stage">
  <div class="book" id="book">
    <div class="ribbons" id="ribbons"></div>
    <button class="bb b-x" aria-label="Close">✕</button>
    <section class="left" id="left"></section>
    <section class="right" id="right"></section>
  </div>
  <div class="phone hidden" id="phone"><div class="screen"><div class="scrim"></div>
    <div class="sheet"><div class="grab"></div><div class="ribbons" id="p-ribbons"></div><div class="body" id="p-body"></div>
      <div class="foot"><button class="bb" aria-label="Close">✕</button></div></div>
  </div></div>
</div>

<script>
// The skills as sim.js has them (SKILLS, SKILL_TOP) and game.js paints them (SKILL_INK, LEVEL_COIN), and a made-up forager.
const TOP = 10;
const COIN = [null, ['#b8743c', '#331a06'], ['#c68a3f', '#331d07'], ['#d9a441', '#4a2f0c'], ['#eecb63', '#4a2f0c'], ['#69b987', '#0f3320'],
  ['#43a89c', '#062f2b'], ['#5a86d6', '#11264d'], ['#9876d2', '#2b1550'], ['#d26786', '#4c1024'], ['#f2e2b0', '#3a2408']];
const METAL = ['', 'Copper', 'Bronze', 'Brass', 'Gold', 'Jade', 'Verdigris', 'Sapphire', 'Amethyst', 'Rose', 'Opal'];
const SKILLS = {
  cooking: { name: 'Cooking', ink: '#d9803a', per: 3, xp: 38, unit: 1, how: 'dishes', line: 'Dishes cook a little quicker', lv: 4,
    perks: [['Dishes cook', 0.035, 'quicker']], opens: { 1: 'Hearth stone, bark bowl', 2: 'Clay griddle', 3: 'Clay pot' },
    later: { 5: 'Smoking rack?', 7: 'Second pot?', 10: 'A signature dish?' } },
  gathering: { name: 'Gathering', ink: '#7a9a46', per: 6, xp: 140, unit: 0.4, how: 'things picked', line: 'Your hands are quicker, and pick more', lv: 6,
    perks: [['Picks', 0.04, 'quicker'], ['Each pick gives', 0.08, 'more']], opens: {}, later: { 4: 'Spot rare finds?', 8: 'A second satchel row?' } },
  stamina: { name: 'Stamina', ink: '#6f9cc9', per: 45, xp: 330, unit: 60, how: 'minutes of sprinting', line: 'Longer, faster sprints, and your breath back sooner', lv: 3,
    perks: [['Sprints', 0.06, 'longer'], ['Runs', 0.02, 'faster'], ['Breath back', 0.05, 'sooner']], opens: {}, later: { 5: 'Wade deeper?', 10: 'Never winded on flat ground?' } },
};
const LOCKED = [['Fishing', 'A rod and a quiet bank'], ['Tracking', 'Read the meadow\'s prints'], ['Fire-craft', 'Fires that last, light in rain']];
const need = (k, lv) => k.per * lv * (lv + 1) / 2;
const pct = v => Math.round(v * 100) + '%';
const coinStyle = lv => `--coin:${COIN[lv][0]};--ink2:${COIN[lv][1]}`;
const coin = (lv, big) => `<span class="coin${lv >= TOP ? ' max' : ''}${big ? ' big' : ''}" style="${coinStyle(lv)}">${lv}</span>`;
const prog = k => k.lv >= TOP ? 1 : (k.xp - need(k, k.lv)) / (need(k, k.lv + 1) - need(k, k.lv));
const left = k => Math.ceil((need(k, k.lv + 1) - k.xp) / k.unit);

const ICON = {
  recipes: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8h12c0 3-2.5 5-6 5S2 11 2 8zM5.5 2.5c1 .9 1 1.9 0 2.8M9 2.5c1 .9 1 1.9 0 2.8"/></svg>',
  finds: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8a5 4 0 0 1 10 0zM8 8v5.5M6.5 13.5h3"/></svg>',
  you: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.8"/><path d="M2.8 14c.6-3 2.7-4.4 5.2-4.4s4.6 1.4 5.2 4.4"/></svg>',
  almanac: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1.5l1.8 3.8 4.1.5-3 2.9.8 4.1L8 10.8l-3.7 2 .8-4.1-3-2.9 4.1-.5z"/></svg>',
  diary: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M11 2l3 3-8 8H3v-3zM9.5 3.5l3 3"/></svg>',
  beasts: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5.5 2.5v4M10.5 2.5v4M3.5 10a4.5 3.8 0 0 0 9 0 4.5 3.8 0 0 0-9 0z"/></svg>',
};
const PARTS = [['recipes', 'Recipes', '#c9733a'], ['finds', 'Finds', '#6f9446'], ['you', 'You', '#4f72a6'],
  ['almanac', 'Almanac', '#b0892f', 1], ['diary', 'Diary', '#8a6aa8', 1], ['beasts', 'Bestiary', '#7c6248', 1]];
function ribbons(on) {
  return PARTS.map(([k, name, c, later]) => `<button class="rb${k === on ? ' on' : ''}${later && k !== on ? ' later' : ''}${k === 'you' && on !== 'you' ? ' new' : ''}" style="--c:${c}">${ICON[k]}<span>${name}</span></button>`).join('');
}

// The forager's face, as the HUD's (a rough stand-in for the fur.js painting).
const FACE = `<svg viewBox="0 0 84 84" width="84" height="84"><circle cx="42" cy="50" r="24" fill="#f1c9a0"/><path d="M16 44c0-16 12-26 26-26s26 10 26 26c-6-6-14-8-26-8s-20 2-26 8z" fill="#c4442f"/>
  <circle cx="42" cy="18" r="5" fill="#e9d6a8"/><circle cx="34" cy="52" r="2.6" fill="#3b2a1e"/><circle cx="50" cy="52" r="2.6" fill="#3b2a1e"/><circle cx="29" cy="59" r="4" fill="#f09a86" opacity="0.5"/>
  <circle cx="55" cy="59" r="4" fill="#f09a86" opacity="0.5"/><path d="M37 61q5 4 10 0" stroke="#3b2a1e" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18 84c4-10 13-14 24-14s20 4 24 14z" fill="#7a5a3a"/></svg>`;

function youSheet() {
  return `<div class="b-head"><h2 class="fr">You</h2><span class="n">Spring · day 4</span></div>
  <div class="who"><div class="face">${FACE}</div>
    <div class="lines"><div class="ln">Name <span class="hand">Axel</span></div>
      <div class="ln">Days in the meadow <span class="hand">23</span></div>
      <div class="ln">Feeling <span class="hand big">cosy</span></div></div></div>
  <hr class="rule">
  <div class="vit" style="margin-top:12px">
    <div><div class="v-top">Warmth <b>cosy · 92%</b></div><div class="bar"><i style="width:92%;--c:#e98a4b"></i></div></div>
    <div><div class="v-top">Tummy <b>full</b></div><div class="bar"><i style="width:80%;--c:#c9a54a"></i></div></div>
    <div><div class="v-top">Stamina <b>fresh</b></div><div class="bar"><i style="width:100%;--c:#6f9cc9"></i></div></div>
    <div><div class="v-top">Health <b>well</b></div><div class="bar"><i style="width:100%;--c:#c4584a"></i></div></div>
  </div>
  <h3 class="sec">Right now</h3>
  <div class="chips"><span class="chip warm">♨ Warm stew inside · 2 h</span><span class="chip wet">Damp</span><span class="chip good">Rested by the fire</span></div>`;
}
function skillRows(on) {
  return `<h3 class="sec">Skills <span>${Object.values(SKILLS).reduce((n, k) => n + k.lv, 0)} levels of ${Object.keys(SKILLS).length * TOP}</span></h3><div class="skills">`
    + Object.entries(SKILLS).map(([id, k]) => `<button class="sk${id === on ? ' on' : ''}" data-sk="${id}">${coin(k.lv)}<div>
      <div class="sk-top"><b>${k.name}</b><span>${k.lv >= TOP ? 'the best it gets' : `${left(k)} ${k.how} to ${k.lv + 1}`}</span></div>
      <div class="bar"><i style="width:${pct(prog(k))};--c:${k.ink}"></i></div></div></button>`).join('')
    + LOCKED.map(([n, s]) => `<div class="sk locked">${coin(1)}<div><div class="sk-top"><b>${n}</b><span>later</span></div><small>${s}</small></div></div>`).join('') + '</div>';
}
function skillPage(id) {
  const k = SKILLS[id], top = k.lv >= TOP;
  const road = Array.from({ length: TOP }, (_, i) => {
    const n = i + 1, opens = k.opens[n] || '', later = k.later[n] || '';
    return `<div class="step${n > k.lv ? ' ahead' : ''}${n === k.lv ? ' here' : ''}" style="${coinStyle(n)}"><span class="pip">${n}</span><em>${opens || (later ? `<span style="opacity:.75">${later}</span>` : '')}</em></div>`;
  }).join('');
  return `<div class="pg-no">Skill · ${METAL[k.lv]} coin</div>
    <div class="plate">${coin(k.lv, true)}</div>
    <h3 class="fr">${k.name} <span style="font-size:18px;color:var(--muted);font-weight:600">level ${k.lv}</span></h3>
    <p class="say">${k.line}.</p>
    <div class="bar" style="height:9px"><i style="width:${pct(prog(k))};--c:${k.ink}"></i></div>
    <div class="prog"><span>${top ? 'The best it gets' : `${left(k)} more ${k.how} to level ${k.lv + 1}`}</span><span>${top ? '' : pct(prog(k))}</span></div>
    <h4>What it gives you now</h4>
    <ul class="perks">${k.perks.map(([what, per, word]) => `<li>${what} <span><b>+${pct(per * k.lv)}</b> <small>${word} · next +${pct(per * Math.min(TOP, k.lv + 1))}</small></span></li>`).join('')}</ul>
    <h4>The road to opal</h4><div class="road">${road}</div>
    <p style="margin-top:10px;font-size:12.5px">Better with ${k.how.replace('minutes of ', '')}. Faint lines are ideas for later.</p>`;
}

function almanac() {
  const L = `<div class="b-head"><h2 class="fr">Almanac</h2><span class="n">Year 1</span></div>
    <h3 class="sec">The meadow so far</h3>
    <dl class="rec"><dt>Days in the meadow</dt><dd>23</dd><dt>Seasons seen</dt><dd>Spring, Summer, Autumn, Winter</dd>
      <dt>Dishes cooked</dt><dd>41</dd><dt>Burnt</dt><dd>3 (sorry)</dd><dt>Favourite dish</dt><dd>Honey porridge × 9</dd>
      <dt>The stone liked best</dt><dd>“Trout on the stone”, 9/10</dd><dt>Coldest night</dt><dd>−8° · day 19</dd>
      <dt>Things gathered</dt><dd>1 284</dd><dt>Finds</dt><dd>27 of 34</dd><dt>Fires lit</dt><dd>12</dd>
      <dt>Gifts given</dt><dd>5 · to Mira</dd><dt>Hugs</dt><dd>11</dd></dl>`;
  const st = [['First frost', 'lived through it', '#355a7a', '-8deg'], ['Forty dishes', 'cooked', '#b8432a', '5deg'], ['A whole year', 'in the meadow', '#6f9446', '-3deg'],
    ['Opal', 'a skill at 10', '#8a6aa8', '7deg', 1], ['Night owl', 'up till dawn', '#355a7a', '0', 1], ['Every find', '34 of 34', '#b0892f', '0', 1],
    ['Good guest', '10 gifts', '#b8432a', '0', 1], ['Feast', '5 dishes, 1 night', '#6f9446', '0', 1], ['Stone\'s 10', 'a perfect dish', '#8a5e22', '0', 1]];
  const R = `<div class="pg-no">Ribbons · 3 of 9</div><p class="say" style="margin-top:8px">Little stamps for what you did, thumped in the way “Learned!” is.</p>
    <div class="stamps">${st.map(([b, s, c, r, not]) => `<div class="stp${not ? ' not' : ''}" style="--sc:${c};--r:${r}"><div><b>${not ? '?' : b}</b><br><small>${not ? s : s}</small></div></div>`).join('')}</div>`;
  return [L, R];
}
function diary() {
  const sketch = `<svg class="doodle" width="96" height="70" viewBox="0 0 96 70" fill="none" stroke="#33406b" stroke-width="1.6" stroke-linecap="round" opacity="0.75">
    <path d="M10 52c8-14 22-20 36-18 10 1 18 6 22 14M40 34c-3-10 0-20 4-26M48 34c2-10 7-18 12-23"/><circle cx="62" cy="44" r="1.6" fill="#33406b"/><path d="M68 47l6 2M10 52c18 4 40 4 58-2M20 60c10 3 30 3 44 0"/></svg>`;
  const L = `<div class="b-head"><h2 class="fr">Diary</h2><span class="n">Written as you go</span></div>
    <div class="entry"><div class="d">Day 23 · autumn, rain</div><p>${sketch}Rain all morning. Sat under the lean-to and watched a rabbit not mind it at all. Two trout by the bend, and the stew didn't burn this time.</p></div>
    <div class="entry"><div class="d">Day 22 · autumn</div><p>Found clay by the river, finally. Mira came over and we made honey porridge for both of us.</p></div>
    <div class="entry"><div class="d">Day 19 · first frost</div><p>So cold I could hardly feel the sticks. The fire held. Cooking went up to <b>4</b>.</p></div>`;
  const R = `<div class="pg-no">Pressed between the pages</div><p class="say" style="margin-top:8px">The first of each flower picked, pressed here, with the day it was found.</p>
    <div style="position:relative;height:330px">
      ${[[40, 30, '#d26786', -8, 'Wild rose · day 6'], [190, 60, '#e9c442', 10, 'Buttercup · day 2'], [70, 190, '#8a6aa8', 4, 'Violet · day 11'], [210, 200, '#5a86d6', -12, 'Cornflower · day 14']]
        .map(([x, y, c, r, s]) => `<div style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${r}deg);text-align:center">
          <span class="tape" style="left:18px;top:-6px;transform:rotate(-6deg)"></span>
          <svg width="80" height="96" viewBox="0 0 80 96"><path d="M40 92C40 70 38 56 40 40" stroke="#6f8f4a" stroke-width="2" fill="none"/><path d="M40 70c-10-2-16-8-18-14 8 0 14 4 18 12z" fill="#7a9a46" opacity=".8"/>
          ${[0, 72, 144, 216, 288].map(a => `<ellipse cx="40" cy="27" rx="7" ry="12" fill="${c}" opacity=".78" transform="rotate(${a} 40 38)"/>`).join('')}<circle cx="40" cy="38" r="4.5" fill="#f0d27a"/></svg>
          <div class="hand" style="font-size:13px">${s}</div></div>`).join('')}
    </div>`;
  return [L, R];
}
function beasts() {
  const A = [['Rabbit', '#a07850', 5, 1], ['Fox', '#e2702f', 3], ['Bee', '#d9a441', 4], ['Crow', '#3b372f', 2], ['Otter', '#7c6248', 2], ['Frog', '#6f9446', 1], ['Trout', '#7f9fb5', 4], ['???', '#000', 0, 0, 1], ['???', '#000', 0, 0, 1]];
  const sil = c => `<svg width="46" height="34" viewBox="0 0 46 34"><ellipse cx="22" cy="21" rx="15" ry="10" fill="${c}"/><circle cx="35" cy="14" r="7" fill="${c}"/><ellipse cx="34" cy="5" rx="2.5" ry="6" fill="${c}"/></svg>`;
  const L = `<div class="b-head"><h2 class="fr">Bestiary</h2><span class="n">7 of 9 met</span></div>
    <h3 class="sec">Who lives here</h3>
    <div class="beasts">${A.map(([n, c, t, on, un]) => `<div class="beast${on ? ' on' : ''}${un ? ' unseen' : ''}">${sil(c)}<span>${n}</span><span class="tally">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= t ? 'on' : ''}"></i>`).join('')}</span></div>`).join('')}</div>
    <p style="margin:12px 0 0;font-size:12.5px;font-weight:700;color:var(--muted)">Dots fill as you learn more of each: seen, watched eating, where it sleeps, what it gives, a sketch.</p>`;
  const R = `<div class="pg-no">No. 1 · Rabbit</div><div class="plate">${sil('#a07850').replace('width="46" height="34"', 'width="150" height="110"')}</div>
    <h3 class="fr">Rabbit</h3><p class="say">Grazes at dusk and dawn; bolts for its burrow at a fox.</p>
    <h4>Notes in the margin</h4><ul class="perks"><li>Seen <b>✓</b></li><li>Where it sleeps <span class="hand" style="font-size:15px">burrows by the birches</span></li>
    <li>What it gives <span class="hand" style="font-size:15px">game, fur</span></li><li>When <span class="hand" style="font-size:15px">all year, fewer in winter</span></li><li>A sketch <small>watch one for a whole minute</small></li></ul>`;
  return [L, R];
}

const NOTES = {
  you: 'Option A, the recommendation: the skills card (I / a tap on the face) moves into the book as a third part, You. Left: the sheet in pencil, as The Forest does it, and the skills as rows. Right: the skill picked, like a recipe page. Click a skill.',
  skill: 'A skill at the top: the opal coin, every step on the road filled. The faint lines on the road are ideas for what a level could open later.',
  almanac: 'Later: records written in as they happen, and ribbons stamped in when earned. All of it is per player (localStorage), like the skills.',
  diary: 'Later: a line a day the game writes for you from what happened (weather, firsts, levels, friends), plus the first of each flower pressed.',
  beasts: 'Later: a page per animal, filled in by watching them (the inspector already knows all this).',
  phone: 'On an upright phone: the usual bottom sheet, the ribbons as a row of 44 px tabs across its top, ✕ at the foot. Tap a skill and its page lays over (depth 2), as a recipe does.',
};
let view = 'you', pick = 'cooking';
function draw() {
  for (const b of document.querySelectorAll('#concepts button')) b.classList.toggle('on', b.dataset.v === view);
  document.getElementById('note').textContent = NOTES[view];
  const phone = view === 'phone';
  document.getElementById('book').classList.toggle('hidden', phone);
  document.getElementById('phone').classList.toggle('hidden', !phone);
  if (phone) {
    document.getElementById('p-ribbons').innerHTML = ribbons('you');
    document.getElementById('p-body').innerHTML = youSheet() + skillRows('');
    return;
  }
  let L, R, part = view;
  if (view === 'you' || view === 'skill') {
    part = 'you';
    if (view === 'skill') { SKILLS.gathering._lv = SKILLS.gathering._lv ?? SKILLS.gathering.lv; SKILLS.gathering.lv = TOP; SKILLS.gathering.xp = need(SKILLS.gathering, TOP); pick = 'gathering'; }
    L = youSheet() + skillRows(pick); R = skillPage(pick);
  } else [L, R] = { almanac, diary, beasts }[view]();
  document.getElementById('ribbons').innerHTML = ribbons(part);
  document.getElementById('left').innerHTML = L;
  document.getElementById('right').innerHTML = R;
}
document.getElementById('concepts').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (view === 'skill' && b.dataset.v !== 'skill') { const g = SKILLS.gathering; g.lv = g._lv; g.xp = 140; pick = 'cooking'; }
  view = b.dataset.v; draw();
});
document.getElementById('left').addEventListener('click', e => { const b = e.target.closest('.sk[data-sk]'); if (!b) return; pick = b.dataset.sk; draw(); });
draw();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dishes Sheet</title>
<style>
  body { margin: 0; padding: 16px; background: #f1ead8; font: 600 14px system-ui, sans-serif; color: #3b372f; }
  canvas { max-width: 100%; height: auto; background: #cfe0a8; border-radius: 12px; }
</style>
</head>
<body>
<p>Every dish the meadow has a painting for, painted by the game's own <code>dishes.js</code>.</p>
<canvas id="sheet"></canvas>
<pre id="atlas"></pre>
<script src="fur.js"></script>
<script src="dishes.js"></script>
<script src="sheet.js"></script>
<script>
// Painted as the game paints them: a square size px, U = size / 1.3 to the dish's box (-1 to 1).
const SIZE = 192, COLS = 6;
const dishes = Dishes.NAMES.map((name, n) => {
  const cv = Object.assign(document.createElement('canvas'), { width: SIZE, height: SIZE });
  Dishes.paint(cv.getContext('2d'), SIZE, SIZE / 1.3, n);
  return { name: name.toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, ''), cv, footX: SIZE / 2, footY: SIZE };
});
const rows = [];
for (let i = 0; i < dishes.length; i += COLS) rows.push(dishes.slice(i, i + COLS));
packSheet(rows, 'dishes.png', 4);
</script>
</body>
</html>

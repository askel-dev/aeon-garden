<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nobody's Meadow</title>
<meta name="description" content="A small meadow that keeps its own time. Rabbits, foxes and bees live their lives, season after season, whether you're watching or not.">
<meta name="theme-color" content="#9cc77e">
<!-- the .ico says 32x32, not "any", or Chrome picks it over the SVG. game.js swaps the SVG as the seasons turn -->
<link rel="icon" href="assets/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" id="favicon">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<!-- added to the home screen it opens with no browser bars at all -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meadow">
<!-- link previews (iMessage, Slack, Discord, ...): these need absolute URLs -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nobody's Meadow">
<meta property="og:title" content="Nobody's Meadow">
<meta property="og:description" content="A small meadow that keeps its own time. Rabbits, foxes and bees live their lives, season after season, whether you're watching or not.">
<meta property="og:url" content="https://meadow.cryptoler.net/">
<!-- ?v= changes with the art: Messages, Slack and friends keep a preview by its image URL for weeks -->
<meta property="og:image" content="https://meadow.cryptoler.net/assets/og.png?v=2">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Nobody's Meadow: a brass pocket watch with the living meadow inside it, over a green hill where a rabbit's ears peek out">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://meadow.cryptoler.net/assets/og.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fraunces only for names: italic 450, upright 600 to 680, soft and wonky -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600..680,100,1;1,9..144,450,100,1&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --card: #f8f0de;         /* parchment; game.js lays a painted grain over it (--paper) */
    --edge: inset 0 0 0 1px rgba(150, 115, 60, 0.22);   /* a thin inked edge */
    --ink: #3b372f;
    --muted: #6f6657;        /* at least 4.5:1 on the cream cards */
    --line: #ecdfc8;
    --accent: #e98a4b;       /* fills, rings, borders; too light for text */
    --accent-ink: #9e4a17;   /* the accent as text: at least 4.5:1 on every card */
    --accent-soft: #fde4cf;
    --good: #6fb350;
    --good-ink: #43762c;     /* green as text */
    --down-ink: #a34f26;     /* fewer, as text */
    --rabbit: #a07850;
    --fox: #e2702f;
    --shadow: 0 8px 28px rgba(70, 55, 25, 0.20), 0 1px 3px rgba(70, 55, 25, 0.12);
    --radius: 18px;
    --hud-h: 46px;           /* the top-right pill */
    /* the edges of the screen, minus the notch, the clock and the home bar */
    --top: calc(16px + env(safe-area-inset-top, 0px));
    /* --home-bar: 0 when iOS already stops the page short of the home bar, see game.js */
    --bottom: calc(16px + var(--home-bar, env(safe-area-inset-bottom, 0px)));
    --left: calc(16px + env(safe-area-inset-left, 0px));
    --right: calc(16px + env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; touch-action: manipulation; }   /* no double-tap zoom in Safari; the meadow does its own zoom */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc77e; }
  body { font-family: Nunito, ui-rounded, system-ui, sans-serif; color: var(--ink); font-size: 14px; }
  /* On a touch screen a held finger never marks text or opens Safari's menu; the idea box, a name and the chat still take a paste. */
  @media (pointer: coarse) {
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    textarea, input { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  }
  /* The meadow fills the whole glass: under the clock and behind Safari's floating bar too (lvh). */
  canvas#world { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100lvh; display: block; touch-action: none;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }   /* a held finger never opens Safari's menu */
  canvas#world.on-animal { cursor: pointer; }
  /* The ground under it, a little bigger than the screen; game.js sizes it and slides it into place. */
  canvas#ground { position: fixed; top: 0; left: 0; display: block; pointer-events: none; transform-origin: 0 0; will-change: transform; }
  .phone-only { display: none; }
  .card {
    position: fixed; background: var(--paper, none) var(--card); border-radius: var(--radius);
    box-shadow: var(--edge), var(--shadow);   /* opaque: a blur behind would redo itself every frame the meadow moves */
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a[data-id], a[data-thing], a[data-act] { color: var(--accent-ink); font-weight: 800; text-decoration: none; cursor: pointer; }
  @media (hover: hover) { a[data-id]:hover, a[data-thing]:hover, a[data-act]:hover { text-decoration: underline; } }
  /* the name is Fraunces, soft and wonky; everything else stays Nunito */
  .fr { font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100, 'WONK' 1; }
  /* ---- a word now and then (game.js toast): one small line top middle, gone in a few seconds */
  #news { position: fixed; z-index: 4; left: 50%; top: calc(var(--top) + 6px); transform: translateX(-50%); width: min(360px, calc(100% - var(--left) - var(--right)));
    display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .news-item {
    background: var(--paper, none) var(--card); border-radius: 12px; padding: 5px 11px; box-shadow: var(--edge), var(--shadow);
    font-size: 13px; line-height: 1.35; animation: pop-in 0.35s ease-out; transition: opacity 0.8s, transform 0.8s;
  }
  .news-item.gone { opacity: 0; transform: translateY(-6px); }
  /* ---- a headline now and then (game.js announce): a new day or season, a first find, a friend's meadow. No card: big
     italic words over the meadow, fading in and out, clicks going through. A first is bigger and gold, between two ✦. */
  #announce { position: fixed; left: 0; right: 0; margin: 0 auto; top: calc(var(--top) + 60px); z-index: 2; pointer-events: none; text-align: center;
    width: fit-content; max-width: min(calc(100vw - 32px), 460px); padding: 6px 22px 10px; box-sizing: border-box;
    background: radial-gradient(closest-side, rgba(35, 28, 15, 0.3), transparent); color: #fff7e4;
    text-shadow: 0 1px 2px rgba(40, 30, 15, 0.6), 0 0 16px rgba(40, 30, 15, 0.4);
    opacity: 0; transform: translateY(-6px); transition: opacity 0.9s ease, transform 0.9s ease; }
  #announce.on { opacity: 1; transform: none; }
  #announce b { display: block; font-size: 22px; font-style: italic; font-weight: 500; line-height: 1.15; text-wrap: balance; }
  #announce:is(.season, .join) b { font-size: 36px; line-height: 1.1; }
  #announce small { display: block; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; white-space: nowrap; }
  #announce p { margin: 5px 0 0; font-size: 15px; font-weight: 650; line-height: 1.35; text-wrap: balance; }
  #announce.first b { font-size: 40px; line-height: 1.1; color: #ffe39a;
    text-shadow: 0 1px 2px rgba(60, 35, 5, 0.7), 0 0 22px rgba(255, 190, 80, 0.55), 0 0 40px rgba(40, 30, 15, 0.4); }
  #announce.first b::before, #announce.first b::after { content: '✦'; font-size: 0.45em; vertical-align: middle; margin: 0 0.5em; font-style: normal; }
  /* Making camp (game.js campMoment): the biggest words, warm as firelight, slower to come and go */
  #announce.camp { transition-duration: 1.4s; transform: translateY(10px); }
  #announce.camp.on { transform: none; }
  #announce.camp b { font-size: 50px; line-height: 1.05; color: #ffd9a0; letter-spacing: 0.01em;
    text-shadow: 0 1px 2px rgba(60, 25, 5, 0.7), 0 0 26px rgba(255, 150, 60, 0.6), 0 0 48px rgba(40, 20, 10, 0.45); }
  #announce.camp p { font-style: italic; font-weight: 500; }
  #announce.camp.on b { animation: camp-pop 1.1s cubic-bezier(0.2, 1.6, 0.4, 1) both, camp-glow 2.4s ease-in-out 1.1s 2; }
  #announce.camp b::before, #announce.camp b::after { content: '✦'; display: inline-block; font-size: 0.4em; vertical-align: middle; margin: 0 0.45em;
    font-style: normal; color: #ffe7b0; }
  #announce.camp.on b::before, #announce.camp.on b::after { animation: camp-twinkle 1.6s ease-in-out 0.4s 3; }
  #announce.camp.on b::after { animation-delay: 1.2s; }
  @keyframes camp-pop { from { transform: scale(0.7); } to { transform: none; } }
  @keyframes camp-glow { 50% { text-shadow: 0 1px 2px rgba(60, 25, 5, 0.7), 0 0 34px rgba(255, 170, 70, 0.95), 0 0 60px rgba(255, 120, 40, 0.5); } }
  @keyframes camp-twinkle { 50% { transform: scale(1.6) rotate(45deg); opacity: 0.5; } }
  @media (prefers-reduced-motion: reduce) { #announce.camp.on b, #announce.camp.on b::before, #announce.camp.on b::after { animation: none; } }
  /* (no translate: a line starting 8px low made the log scroll that much, and it stayed cut off at the top) */
  @keyframes chat-in { from { transform: scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop-in { from { transform: translateY(8px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
  /* ---- top right: time and sound, then the inspector below */
  #hud-right { position: fixed; top: var(--top); right: var(--right); bottom: var(--bottom); z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
  #hud-right > * { pointer-events: auto; }
  #hud-right .card { position: relative; }
  .hud-top { position: relative; display: flex; flex-direction: column; align-items: flex-end; }
  #time { display: flex; align-items: center; gap: 3px; height: var(--hud-h); padding: 0 5px; border-radius: 16px; }
  .hud-btn { border: none; background: transparent; border-radius: 9px; height: 36px; min-width: 36px; padding: 0 6px;
    font-size: 17px; position: relative; transition: background 0.15s; }
  @media (hover: hover) { .hud-btn:hover { background: rgba(0,0,0,0.06); } }
  .hud-btn.on { background: var(--accent-soft); }
  .hud-btn.more { font-size: 10px; letter-spacing: 1px; color: var(--muted); font-weight: 900; }
  /* menus drop from the top-right pill and float over the inspector */
  #hud-right .drop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 2; padding: 6px; animation: pop-in 0.18s ease-out; }
  #more-menu { display: flex; flex-direction: column; min-width: 230px; }
  .menu-item { border: none; background: transparent; text-align: left; border-radius: 10px; padding: 8px 10px; font-weight: 800; }
  @media (hover: hover) { .menu-item:hover { background: rgba(0,0,0,0.05); } }
  .menu-item.danger { color: #a4452a; }
  @media (hover: hover) { .menu-item.danger:hover { background: #fbe3d9; } }
  /* ---- inspector, right */
  #inspector { width: 340px; min-height: 0; overflow-y: auto; padding: 20px 20px 18px; display: none; }
  #inspector.open { display: block; animation: pop-in 0.3s ease-out; }
  .ins-head { display: flex; gap: 14px; align-items: center; }
  .portrait { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 38px; flex: none; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.08); }
  .portrait img { width: 77%; }
  .ins-name { font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100, 'WONK' 1; font-weight: 650; font-size: 22px; line-height: 1.1; }
  .ins-sub { color: var(--muted); font-weight: 700; font-size: 12.5px; margin-top: 4px; }
  .close { margin-left: auto; align-self: flex-start; border: none; background: transparent; font-size: 16px; color: var(--muted); border-radius: 8px; padding: 2px 6px; }
  @media (hover: hover) { .close:hover { background: rgba(0,0,0,0.06); } }
  .mood { margin-top: 16px; background: #fffaf0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 800; font-size: 15px; }
  .meters { margin-top: 14px; display: grid; gap: 9px; }
  .meter-row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800; color: var(--muted); }
  .meter { height: 9px; background: #efe5d3; border-radius: 99px; overflow: hidden; }
  .meter span { display: block; height: 100%; border-radius: 99px; background: var(--good); transition: width 0.3s; }
  .meter.low span { background: #e0823f; }
  .meter.stamina span { background: #6aa6d8; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .chip { background: var(--accent-soft); color: #9a5024; border-radius: 99px; padding: 4px 11px; font-weight: 800; font-size: 12px; }
  #inspector h4 { margin: 24px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); }
  .story-more { margin-top: 8px; padding: 2px 0; border: none; background: none; font: inherit; font-size: 12.5px; font-weight: 800; color: #9a5024; }
  .family { font-size: 13.5px; line-height: 1.7; }
  .mood + .family, .meters + .family, .chips + .family { margin-top: 16px; }
  .story { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .story li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .story li:last-child { border-bottom: none; }
  .story .when { margin-top: 1px; color: var(--muted); font-size: 11px; font-weight: 700; }
  .facts { margin-top: 14px; }
  .family .dim { color: var(--muted); font-size: 12px; }
  .meter.honey span { background: #e8b83a; }
  .ins-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .ins-actions .btn { white-space: nowrap; padding: 8px 9px; }
  .btn { border: none; border-radius: 12px; padding: 8px 12px; font-weight: 800; background: #fff; box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line) inset; flex: 1; }
  @media (hover: hover) { .btn:hover { background: #fff7ec; } }
  .btn.on { background: var(--accent-soft); color: #9a5024; }
  /* ---- asking for ideas, once, after two minutes of play (game.js, askIdeas). No backdrop: the meadow goes on behind it. */
  #ask { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; width: min(400px, calc(100% - 32px)); padding: 22px 24px 20px;
    background: var(--paper, none) #f7eedc; border-radius: 22px; box-shadow: 0 20px 60px rgba(50, 40, 15, 0.3); }
  #ask:not(.hidden) > * { animation: pop-in 0.18s ease-out; }
  #ask h2 { margin: 0 0 6px; font-size: 24px; font-weight: 650; line-height: 1.15; }
  #ask p { margin: 0 0 12px; line-height: 1.5; color: var(--muted); }
  #ask textarea { display: block; box-sizing: border-box; width: 100%; min-height: 84px; resize: vertical; margin: 0 0 14px; padding: 10px 12px;
    border: 1.5px solid #d9ccb0; border-radius: 12px; background: #fffaf0; font: inherit; font-size: 16px; color: var(--ink); }
  #ask textarea:focus { outline: none; border-color: #4f7f3a; }
  #ask .btns { display: flex; gap: 10px; }
  #ask .later { flex: none; border-radius: 14px; background: #fbf5e8; padding: 12px 16px; box-shadow: none; }
  #ask .go { border-radius: 14px; background: #4f7f3a; color: #fff; font-size: 16px; padding: 12px; box-shadow: none; }
  @media (hover: hover) { #ask .go:hover { background: #44702f; } }
  #ask .go:disabled { opacity: 0.5; }
  #ask.sent :is(textarea, .btns, .ask-q), #ask:not(.sent) .ask-thanks { display: none; }
  /* ---- the wardrobe (game.js wardrobe): the forager painted as it'll look, its name (playing together), a row of hats and a
     row of cloaks. At the foot as a new meadow opens; joining a friend's meadow it's in the middle over a dimmed meadow. On a
     touch screen it sits up top, out of the keyboard's way. */
  #wardrobe { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 9;
    width: min(460px, calc(100% - 32px)); box-sizing: border-box; padding: 12px 16px 14px; background: var(--paper, none) var(--card);
    border-radius: 20px; box-shadow: var(--edge), var(--shadow); }
  #wardrobe.join { top: 50%; bottom: auto; transform: translate(-50%, -50%); box-shadow: var(--edge), var(--shadow), 0 0 0 100vmax rgba(34, 28, 16, 0.38); }
  #wardrobe:not(.hidden) > * { animation: pop-in 0.3s ease-out; }
  #wardrobe-form { display: grid; grid-template-columns: 104px minmax(0, 1fr); column-gap: 12px; row-gap: 4px;
    grid-template-areas: 'head head' 'fig name' 'fig hats' 'fig cloaks' 'fig said' 'btns btns'; }
  .wd-head { grid-area: head; margin-bottom: 4px; } #wd-figure { grid-area: fig; } .wd-name { grid-area: name; } .wd-hats { grid-area: hats; }
  .wd-cloaks { grid-area: cloaks; } #wd-name-hat { grid-area: said; } .wd-btns { grid-area: btns; }
  #wardrobe h2 { margin: 0; font-size: 19px; font-weight: 650; line-height: 1.2; }
  #wardrobe-sub { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  /* (a phone upright: the figure up by the title, the hats and the cloaks the card's width under it) */
  @media (max-width: 480px) {
    #wardrobe-form { grid-template-columns: minmax(0, 1fr) 84px; grid-template-areas: 'head fig' 'name fig' 'hats hats' 'cloaks cloaks' 'said said' 'btns btns'; }
    #wardrobe #wd-figure { width: 84px; } #wardrobe #wd-look { width: 84px; height: 140px; }
  }
  #wd-figure { position: relative; flex: none; width: 104px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 8px;
    border-radius: 14px; background: radial-gradient(ellipse 34px 7px at 50% calc(100% - 14px), rgba(70, 55, 25, 0.2), transparent), rgba(160, 190, 110, 0.22); }
  #wd-look { width: 104px; height: 173px; }
  #wd-figure.pop #wd-look { animation: wd-hop 0.32s ease-out; }
  @keyframes wd-hop { 40% { transform: translateY(-7px) scaleY(1.03); } }
  .wd-dice { position: absolute; right: 3px; bottom: 3px; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; font-size: 17px;
    background: rgba(255, 250, 240, 0.85); box-shadow: inset 0 0 0 1px #d9ccb0; cursor: pointer; }
  .wd-label { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: 0.02em; }
  #wardrobe:not(.named) .wd-named { display: none; }
  #name-text { display: block; width: 100%; box-sizing: border-box; margin: 2px 0 4px; padding: 7px 11px; border: 1.5px solid #d9ccb0; border-radius: 12px;
    background: #fffaf0; font: inherit; font-size: 16px; color: var(--ink); }
  #name-text:focus { outline: none; border-color: #4f7f3a; }
  .wd-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px; }
  .wd-hat, .wd-cloak { flex: none; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 12px; cursor: pointer; transition: transform 0.12s; }
  .wd-hat { background: rgba(255, 250, 240, 0.7); box-shadow: inset 0 0 0 1px #e2d6bb; overflow: hidden; }
  .wd-hat canvas { display: block; width: 40px; height: 40px; pointer-events: none; }
  .wd-cloak { border-radius: 50%; background: linear-gradient(180deg, var(--hood) 0 42%, var(--cloak) 42%); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
  .wd-hat.on, .wd-cloak.on { box-shadow: inset 0 0 0 1px #e2d6bb, 0 0 0 2.5px var(--accent); }
  @media (hover: hover) { .wd-hat:hover, .wd-cloak:hover { transform: translateY(-1px); } }
  .wd-hat:active, .wd-cloak:active { transform: translateY(1px); }
  #wd-name-hat { font-size: 12px; color: var(--muted); min-height: 1.2em; }
  .wd-btns { display: flex; gap: 8px; margin-top: 8px; }
  .wd-btns .later { flex: none; border-radius: 14px; background: #fbf5e8; padding: 10px 16px; box-shadow: none; }
  #wardrobe.join .later { display: none; }
  #wd-go { flex: 1; border-radius: 14px; background: #4f7f3a; color: #fff; font-size: 16px; padding: 10px; box-shadow: none; }
  @media (hover: hover) { #wd-go:hover:not(:disabled) { background: #44702f; } }
  #wd-go:disabled { opacity: 0.5; }
  @media (pointer: coarse) {
    #wardrobe, #wardrobe.join { top: calc(var(--top) + 52px); bottom: auto; transform: translateX(-50%); }
    .wd-hat, .wd-cloak, .wd-hat canvas { width: 44px; height: 44px; }
    .wd-dice { width: 44px; height: 44px; right: -6px; bottom: -6px; }
    #name-text, .wd-btns .btn { min-height: 44px; }
  }
  /* ---- playing together, the chat (game.js chat): what was said, a few lines bottom left that fade after a while (all of
     them back while it's open), and under them while it's open a small card: things to say with one tap (CHAT_QUICK), and
     the line to type on. On a touch screen it opens up top instead, out of the keyboard's way (below). */
  #chat { position: fixed; z-index: 6; left: var(--left); bottom: var(--bottom); width: min(340px, calc(100% - var(--left) - var(--right)));
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
  #chat.open { z-index: 10; }
  #chat-log { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-height: 40vh; overflow: hidden; }
  .chat-line { max-width: 100%; box-sizing: border-box; padding: 3px 10px; border-radius: 11px; background: var(--paper, none) var(--card);

  /* Upright phones: a sheet from the bottom, nearly the whole height. Nothing to reach for at the top: its handle drags it
     down, and ✕ sits at the bottom in the middle. A page is a card laid over the tiles, with ‹ ✕ › in the same place (✕
     lays it back down); a swipe sideways turns to the next. Back closes either. */
  @media (max-width: 760px) and (min-height: 501px) {

      padding: 10px 16px calc(14px + var(--home-bar, env(safe-area-inset-bottom, 0px))); border-top: 1px dashed var(--line); }
    #book .bb { width: 52px; height: 52px; }
    #book .bb.x { width: 60px; height: 60px; }
    #book .bb.x svg { width: 24px; height: 24px; }
    #book .b-page { display: none; grid-area: auto; grid-row: 2 / 4; grid-column: 1; z-index: 2; margin: 0 6px; border-radius: 18px 18px 0 0;

    body:has(#book:not(.hidden)) #satchel { opacity: 0; pointer-events: none; }
  }
  /* Phones on their side: the open book over the whole screen, its ✕ and ‹ › big enough for a thumb from either side. */
  @media (max-height: 500px) {

  @media (prefers-reduced-motion: reduce) { #book:not(.hidden) > * { animation: none; } #book .stamp { animation: none; } #book-btn.new::after { animation: none; opacity: 0.8; } }
  /* ---- the fire button (game.js renderBuild, buildIcon): by the satchel, a laid campfire in a ring that fills in as the
     satchel holds more of what one takes (--k); all there (.ready) it glows, and while a spot is picked (.on) it's pressed in */
  #build { position: absolute; right: calc(100% + 8px); bottom: 0; width: 46px; height: 46px; padding: 0; border: none; border-radius: 50%;
    background: var(--paper, none) var(--card); box-shadow: var(--edge), var(--shadow); transition: transform 0.15s, background-color 0.2s; }
  #build::before { content: ''; position: absolute; inset: 2px; border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--k, 0) * 360deg), rgba(150, 115, 60, 0.18) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 3.5px), #000 calc(100% - 3px)); }
  #build::after { content: ''; position: absolute; z-index: -1; inset: -10px; border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(closest-side, rgba(255, 168, 70, 0.6), rgba(255, 150, 60, 0)); }
  #build.ready::after { animation: build-ready 2.6s ease-in-out infinite; }
  @keyframes build-ready { 50% { opacity: 1; } }
  #build i { position: absolute; inset: 5px; background: center / contain no-repeat; opacity: 0.5; filter: saturate(0.4); transition: opacity 0.3s, filter 0.3s; }
  #build.ready i { opacity: 1; filter: none; }

  #build.on::after { animation: none; }
  @media (hover: hover) { #build:hover { transform: translateY(-1px); } }
  #build:active { transform: translateY(1px); }
  /* a phone: over the satchel's left end, a fingertip's size */
  @media (pointer: coarse) { #build { right: auto; left: 0; bottom: calc(100% + 8px); width: 50px; height: 50px; } }
  /* a phone: the chat's lines sit over the satchel and the body's bars; open, its card goes across the foot */
  @media (max-width: 760px), (max-height: 500px) {
    #chat { bottom: calc(var(--bottom) + 104px); }
    body:has(#build:not(.hidden)) #chat:not(.open) { bottom: calc(var(--bottom) + 122px); }   /* (over the fire button) */
    #chat.open { bottom: var(--bottom); right: var(--right); width: auto; }
    #chat.open #chat-log { max-height: 30vh; }
  }
  /* A touch screen: the keyboard would cover the foot (and Safari won't slide the page up for it), so open, the chat goes
     up top (game.js keyboardUp puts --pill-foot and --pill-side): top left, under the pill on an upright phone, beside it on
     its side. The line to type on comes first, the quick ones under it, then what was said, so nothing moves the line;
     while the keyboard's up (.kb) the quick ones go and only the last lines stay. */
  @media (pointer: coarse) {
    #chat.open { top: var(--top); bottom: auto; }
    #chat.open #chat-bar { order: -1; }
    #chat-form { order: -1; }
    #chat.kb #chat-quick { display: none; }
    #chat.kb #chat-log { max-height: 80px; }
  }
  @media (pointer: coarse) and (max-width: 760px) { #chat.open { top: var(--pill-foot, calc(var(--top) + 54px)); } }
  @media (pointer: coarse) and (max-height: 500px) {
    #chat.open { top: var(--top); right: var(--pill-side, 240px); }
    #chat.kb #chat-log { display: none; }
  }
  /* an upright phone: the inspector's sheet comes up from the bottom, and the satchel steps aside for it */
  @media (max-width: 760px) and (min-height: 501px) {
    body:has(#inspector.open) #satchel { opacity: 0; transform: translate(-50%, 30px); pointer-events: none; }
    body:has(#inspector.open) #chat:not(.open) { opacity: 0; }
  }
  /* ---- the forager's body (game.js renderVitals): two slim bars over the satchel, warmth and stamina, each shown only
     while it isn't full (a drop by the warmth while it's wet); frost creeping in at the edges while it's freezing; and the
     dark it collapses into, while the night runs by */
  #vitals { position: fixed; z-index: 4; left: 50%; bottom: calc(var(--bottom) + 54px); transform: translateX(-50%); display: flex; gap: 8px;
    pointer-events: none; transition: opacity 0.35s, transform 0.35s; }
  .vital { display: flex; align-items: center; gap: 5px; padding: 3px 8px 3px 6px; border-radius: 10px; opacity: 0; transform: translateY(4px);
    background: var(--paper, none) var(--card); box-shadow: var(--edge), var(--shadow); transition: opacity 0.6s, transform 0.6s; }

  .vital .bar { position: relative; width: 54px; height: 5px; border-radius: 3px; background: rgba(120, 90, 50, 0.18); overflow: hidden; }
  .vital .bar i { position: absolute; inset: 0 auto 0 0; width: 100%; border-radius: 3px; background: currentColor; transition: width 0.3s linear; }
  #v-warm { color: var(--c, rgb(222, 128, 58)); transition: opacity 0.6s, transform 0.6s, color 0.6s; }
  #v-warm .drop { color: #6f9cc9; opacity: 0; transition: opacity 0.6s; margin-left: -1px; }
  #v-stam { color: #8a9a52; }
  #v-food { color: #c98f2e; }
  #v-food.starving .bar { animation: winded 0.7s ease-in-out infinite alternate; }
  #v-food svg path { stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; }
  #v-stam.winded .bar i { animation: winded 0.7s ease-in-out infinite alternate; background: #b4834a; }
  @keyframes winded { to { opacity: 0.45; } }
  @media (pointer: coarse) { #vitals { bottom: calc(var(--bottom) + 60px); } }
  @media (max-width: 760px) and (min-height: 501px) {
    body:has(#inspector.open) #vitals { opacity: 0; transform: translate(-50%, 30px); }
  }
  #frost { position: fixed; inset: 0; z-index: 3; display: none; pointer-events: none; opacity: 0; transition: opacity 1.2s;
    background: radial-gradient(circle at 0 0, rgba(240, 247, 255, 0.85), rgba(232, 242, 252, 0) 32%),
      radial-gradient(circle at 100% 0, rgba(240, 247, 255, 0.8), rgba(232, 242, 252, 0) 28%),
      radial-gradient(circle at 0 100%, rgba(240, 247, 255, 0.8), rgba(232, 242, 252, 0) 30%),
      radial-gradient(circle at 100% 100%, rgba(240, 247, 255, 0.85), rgba(232, 242, 252, 0) 34%),
      radial-gradient(ellipse 80% 75% at 50% 50%, rgba(232, 242, 252, 0) 66%, rgba(226, 238, 250, 0.3) 85%, rgba(236, 245, 255, 0.75) 100%); }
  #frost.on { display: block; }
  #veil { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; opacity: 0; background: #0d111c;
    transition: opacity 1.3s ease-in; }
  #veil.dark { opacity: 1; pointer-events: auto; transition: opacity 1.3s ease-out; }
  #veil p { margin: 0; color: #c9cfdc; font: italic 400 20px/1.4 Fraunces, Georgia, serif; opacity: 0; transition: opacity 1s 0.6s; }
  #veil.dark p { opacity: 0.85; }
  @media (prefers-reduced-motion: reduce) { .close { transition: none; } }
  /* ---- a new meadow's opening (game.js startIntro): black bars top and bottom as in a film, the name in the lower one, and
     everything else on the page away till they slide off */
  #intro { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  #intro .lb { position: absolute; left: 0; right: 0; height: max(52px, 11vh); background: #07080b;
    transition: transform 1.1s cubic-bezier(0.6, 0, 0.3, 1); }
  #intro .lb.top { top: 0; transform: translateY(-100%); }
  #intro .lb.bottom { bottom: 0; transform: translateY(100%); display: grid; place-content: center; text-align: center; }
  #intro.on .lb { transform: none; transition: none; }   /* (in at once: it opens letterboxed) */
  #intro h1 { margin: 0; color: #ece4d2; font: italic 450 clamp(19px, 3.6vh, 30px)/1.15 Fraunces, Georgia, serif;
    font-variation-settings: 'SOFT' 100, 'WONK' 1; opacity: 0; transform: translateY(6px); transition: opacity 1.4s, transform 1.8s ease-out; }
  #intro p { margin: 4px 0 0; color: #9a9384; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
    opacity: 0; transition: opacity 1.4s 0.5s; }
  #intro.named h1 { opacity: 0.95; transform: none; }
  #intro.named p { opacity: 0.8; }
  body.intro #hud-right, body.intro #satchel, body.intro #vitals, body.intro #news, body.intro #chat { opacity: 0; pointer-events: none; }
  #hud-right, #satchel, #vitals, #news, #chat { transition: opacity 0.9s; }
  @media (max-height: 500px) { #intro .lb { height: max(40px, 9vh); } #intro p { display: none; } }
</style>
</head>
<body>
<canvas id="world"></canvas>
<!-- a new meadow's opening: black bars, the name in the lower one (game.js startIntro) -->
<div id="intro" aria-hidden="true"><div class="lb top"></div><div class="lb bottom"><h1>Nobody&rsquo;s Meadow</h1><p>Spring &middot; late afternoon</p></div></div>
<!-- a word now and then, gone in a few seconds (game.js toast) -->
<div id="news"></div>
<div id="announce" aria-live="polite"></div>

<!-- the forager's body (game.js renderVitals): frost at the edges while freezing, the dark it collapses into, and over the
     satchel two slim bars, warmth and stamina -->
<div id="frost"></div>
<div id="veil"><p>Too cold to go on&hellip;</p></div>
<div id="vitals">
  <div class="vital" id="v-warm" title="Warmth"><svg viewBox="0 0 12 12"><path d="M6.2 .8c.4 2.1 3.3 3.4 3.3 6.3a3.5 3.5 0 0 1-7 0c0-1.6.9-2.6 1.7-3.4.1 1.1.6 1.8 1.3 2 -.3-1.7-.1-3.4.7-4.9z"/></svg><span class="bar"><i></i></span><svg class="drop" viewBox="0 0 12 12"><path d="M6 1.2C7.6 3.8 9.2 5.5 9.2 7.6a3.2 3.2 0 0 1-6.4 0C2.8 5.5 4.4 3.8 6 1.2z"/></svg></div>
  <div class="vital" id="v-food" title="Fed"><svg viewBox="0 0 12 12"><path d="M1 5.6h10c0 2.6-2 4.6-4.6 4.6H5.6C3 10.2 1 8.2 1 5.6zM4.2 1.2c.8.7.8 1.5 0 2.2M6.6 1.2c.8.7.8 1.5 0 2.2"/></svg><span class="bar"><i></i></span></div>
  <div class="vital" id="v-stam" title="Stamina"><svg viewBox="0 0 12 12"><path d="M3.2 1h3.3v4.6l3 1.3c.9.4 1.5 1.1 1.5 2v.9H1.6v-1.2c.6-.2 1-.7 1.1-1.3z"/></svg><span class="bar"><i></i></span></div>
</div>

<!-- bottom middle: the satchel, a row of slots (game.js renderSatchel), and by it the fire button (renderBuild) -->
<div id="cook" class="hidden" role="dialog" aria-label="Cooking at the fire" tabindex="-1">
  <p id="cook-what" aria-live="polite"></p>
  <div class="cook-row">
    <button id="cook-stick" data-act="cook-stick" title="A stick on the fire (F)" aria-label="A stick on the fire"><i></i><b></b></button>
    <button id="cook-book" data-act="book" title="Recipes (B)" aria-label="Recipe book"><i></i></button>
    <button id="cook-go" data-act="cook-go">Cook</button>
    <button class="close" data-act="cook-close" title="Leave the fire (Esc)" aria-label="Leave the fire">✕</button>
  </div>
</div>
<!-- the recipe book, open on the meadow (game.js, the recipe book: its pages are written there) -->
<div id="book-scrim" class="hidden" data-act="book-close"></div>
<div id="book" class="hidden" role="dialog" aria-labelledby="book-title" tabindex="-1"></div>
<div id="eat" class="hidden"></div>
<div id="satchel" class="empty"><div class="slots"></div>
  <button id="book-btn" data-act="book" title="Recipes (B)" aria-label="Recipe book"><i></i></button>
  <button id="build" class="hidden" data-act="build" title="Make a campfire (F)" aria-label="Make a campfire"><i></i></button>
</div>

<!-- top right: pause, sound and the ••• menu; the inspector hangs underneath -->
<div id="hud-right">
  <div class="hud-top">
  <div id="time" class="card">
    <button class="hud-btn hidden" id="friends-btn" data-act="together" title="Playing together">🧺</button>
    <button class="hud-btn hidden" id="chat-btn" data-act="chat" title="Say something to your friends (Enter)">💬</button>
    <button class="hud-btn" data-act="pause" title="Pause (space)">⏸</button>
    <button class="hud-btn wide-only" id="sound-btn" data-act="sound" title="Sound on or off (M)">🔇</button>
    <button class="hud-btn more" data-act="more" title="More">•••</button>
  </div>
  <div id="more-menu" class="card drop hidden">
    <button class="menu-item phone-only" data-act="sound" id="sound-item"><span class="e">🔇</span> <span class="l">Sound is off</span></button>
    <button class="menu-item" data-act="copy-link"><span class="e">🔗</span> <span class="l">Copy a link<span class="x"> to this meadow</span></span></button>
    <button class="menu-item" data-act="together"><span class="e">🧺</span> <span class="l">Play together<span class="x"> with a friend</span></span></button>
    <button class="menu-item hidden" data-act="leave" id="leave-item"><span class="e">🚪</span> <span class="l">Leave<span class="x"> playing together</span></span></button>
    <button class="menu-item" data-act="pick-outfit"><span class="e">🎩</span> <span class="l">Change your outfit<span class="x">: hat and cloak</span></span></button>
    <button class="menu-item" data-act="pick-name"><span class="e">✏️</span> <span class="l">Change your name</span></button>
    <button class="menu-item" data-act="ideas" title="Tell me what you'd love to see in the meadow"><span class="e">💌</span> <span class="l">Send an idea</span></button>
    <button class="menu-item danger" data-action="new">🔄 Start a new meadow…</button>
  </div>
  </div>
  <aside id="inspector" class="card"></aside>
</div>

<!-- the wardrobe: the forager's name, hat and cloak, picked before joining a friend's meadow, as a new meadow opens, and from
     ••• (game.js wardrobe; its buttons put in by it) -->
<div id="wardrobe" class="hidden" role="dialog" aria-labelledby="wardrobe-title">
  <form id="wardrobe-form" autocomplete="off">
    <div class="wd-head"><h2 class="fr" id="wardrobe-title">Your forager</h2><p id="wardrobe-sub"></p></div>
    <div id="wd-figure"><canvas id="wd-look" aria-hidden="true"></canvas>
      <button type="button" class="wd-dice" data-act="wd-dice" title="Surprise me" aria-label="Surprise me">🎲</button></div>
    <div class="wd-name wd-named"><label class="wd-label" for="name-text">Your name</label>
      <input id="name-text" maxlength="16" autocomplete="nickname" enterkeyhint="go" placeholder="What friends call you"></div>
    <div class="wd-hats"><div class="wd-label">Hat</div><div id="wd-hats" class="wd-row"></div></div>
    <div class="wd-cloaks"><div class="wd-label">Cloak</div><div id="wd-cloaks" class="wd-row"></div></div>
    <div id="wd-name-hat"></div>
    <div class="wd-btns"><button type="button" class="btn later" data-act="wd-close">Not now</button><button type="submit" class="btn go" id="wd-go">That’s me</button></div>
  </form>
</div>

<!-- playing together: what friends said, a few lines bottom left that fade, and while it's open a small card to say something
     (game.js chat): things to say with a tap (CHAT_QUICK, put in by game.js), and the line to type on -->
<div id="chat" class="hidden">
  <div id="chat-log" aria-live="polite"></div>
  <div id="chat-bar">
    <div id="chat-quick"></div>
    <form id="chat-form"><input id="chat-text" maxlength="120" autocomplete="off" enterkeyhint="send" placeholder="Say something…" aria-label="Say something to your friends">
    <button class="go" type="submit">Say</button></form>
  </div>
</div>

<div id="ask" class="hidden" role="dialog" aria-labelledby="ask-title">
  <h2 class="fr" id="ask-title">Enjoying the meadow? 🙂</h2>
  <p class="ask-q">Is there anything fun you'd love to see in it next? I read every idea.</p>
  <textarea id="ask-text" maxlength="2000" placeholder="An animal, a thing to do, anything…" aria-label="Your idea"></textarea>
  <div class="btns">
    <button class="btn later" data-act="ask-later">Not now</button>
    <button class="btn go" id="ask-send" data-act="ask-send">Send</button>
  </div>
  <p class="ask-thanks">Thank you! 🌼 It's on its way.</p>
</div>

<script src="sim.js"></script>
<script src="fur.js"></script>
<script src="sound.js"></script>
<script src="ground.js"></script>
<script src="recipes.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
</body>
</html>

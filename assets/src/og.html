<!doctype html>
<!-- Source for assets/og.png, the link preview card (1200x630): the itch cover (cover.html) laid out wide.
     Render with headless Chrome:
       chrome --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=8000 \
              --screenshot=og.png "file://$PWD/og.html"
     ../meadow.jpg is the running game, cropped to the watch face. Fraunces comes from Google Fonts,
     so render online. -->
<html><head><meta charset="utf-8">

<style>

body{position:relative;background:#F1DDB0;color:#3B372F}
svg{position:absolute;left:0;top:0}
.fr{font-family:Fraunces,Georgia,serif;font-variation-settings:'SOFT' 100,'WONK' 1}
/* the watch face: centre (900, 262), dial radius 32.5 at scale 2.9 */
.face{position:absolute;left:805.75px;top:167.75px;width:188.5px;height:188.5px;border-radius:50%;overflow:hidden;background:#8CC56A}
.face img{display:block;width:100%;height:100%}
.name{position:absolute;left:84px;top:92px}
.name .a{font-size:58px;font-style:italic;font-weight:450;line-height:1;margin-left:8px}
.name .b{font-size:156px;font-weight:680;line-height:.92;letter-spacing:-.02em}
.name .c{margin:20px 0 0 10px;font-size:32px;font-style:italic;font-weight:450;color:#6F6657}
</style></head><body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper HUD mock</title>
<!-- A mock of the ?keep HUD (not committed). Each frame is the real game at ?keep&seed=31, run into the Dry Year,
     with a placeholder HUD laid over it. ?device=desktop|phone|side, ?when=during|before, ?look=today|story|brass. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,600..680,100,1;1,9..144,450,100,1&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #24211b; color: #f3e7cf; font-family: Nunito, system-ui, sans-serif; }
  header { padding: 16px 24px 4px; display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; }
  h1 { font-family: Fraunces, Georgia, serif; font-variation-settings: 'SOFT' 100, 'WONK' 1; font-weight: 650; font-size: 24px; margin: 0; }
  .seg { display: flex; background: #36312a; border-radius: 10px; padding: 3px; }
  .seg a { color: #bfae8c; text-decoration: none; font-weight: 800; font-size: 13px; padding: 5px 11px; border-radius: 8px; }
  .seg a.on { background: #f3e7cf; color: #3b372f; }
  .note { color: #bfae8c; font-size: 13px; font-weight: 700; margin: 2px 24px 0; }
  .legend { display: flex; gap: 6px 16px; flex-wrap: wrap; margin: 8px 24px 0; font-size: 13px; font-weight: 700; color: #d9ccb0; }
  .legend span b { font-weight: 900; }
  #grid { display: flex; gap: 18px; padding: 12px 24px 28px; justify-content: center; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { font-weight: 900; margin: 0 0 6px; font-size: 15px; }
  figcaption small { display: block; color: #bfae8c; font-weight: 700; font-size: 12.5px; }
  .box { position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); background: #9cc77e; }
  .box iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(36, 33, 27, 0.7); font-weight: 800; transition: opacity 0.4s; }
  .wait.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>The keeper's HUD: a mock</h1>
  <div class="seg" id="devices"></div>
  <div class="seg" id="whens"></div>
</header>
<p class="note">The real game at ?keep&amp;seed=31 with a pond dug on the first morning, run to day 4 of a summer and paused. Everything over the meadow in the two new looks is a placeholder; the numbers are the meadow's.</p>
<p class="legend"><span>Species marks:</span><span><b style="color:#5a9a3a">▲</b> thriving</span><span>nothing: steady</span><span><b style="color:#c46a2a">▼</b> fewer</span><span><b style="color:#c23b2b">!</b> endangered</span><span><s>gone</s></span></p>
<main id="grid"></main>
<script>
const P = new URLSearchParams(location.search);
const DEVICES = { desktop: [1280, 800, 'Desktop'], phone: [390, 844, 'Phone'], side: [844, 390, 'Phone on its side'] };
const device = DEVICES[P.get('device')] ? P.get('device') : 'desktop';
const when = P.get('when') === 'before' ? 'before' : 'during';
const LOOKS = [['today', 'Today', 'what ?keep shows now'], ['story', 'A. Storybook, anchored', 'today’s parchment cards, pinned to the edges of the screen'],
  ['brass', 'B. First draft', 'the wording of the first mock'], ['plain', 'B. Plain words', 'short labels, numbers and icons in place of sentences']];
const only = LOOKS.find(([k]) => k === P.get('look'));
const SHOWN = (P.get('looks') || 'brass,plain').split(',').map(k => LOOKS.find(l => l[0] === k)).filter(Boolean);
const LINK = '?seed=31&keep';

const nav = (k, v) => { const q = new URLSearchParams(location.search); q.set(k, v); return '?' + q; };
document.querySelector('#devices').innerHTML = Object.entries(DEVICES).map(([k, [, , name]]) => `<a href="${nav('device', k)}" class="${k === device ? 'on' : ''}">${name}</a>`).join('');
document.querySelector('#whens').innerHTML = [['during', 'In the Dry Year'], ['before', 'The summer before']].map(([k, name]) => `<a href="${nav('when', k)}" class="${k === when ? 'on' : ''}">${name}</a>`).join('');

// No kept meadow of this link may open in the frames: each starts it new (and keeps it again when it's left).
async function forget() {
  try {
    const list = JSON.parse(localStorage.getItem('aeon-garden-kept-keep') || '[]').filter(k => k.link !== LINK);
    localStorage.setItem('aeon-garden-kept-keep', JSON.stringify(list));
    localStorage.setItem('aeon-garden-keep-card', '0');
  } catch (e) { /* fine */ }
  await new Promise(ok => {
    const r = indexedDB.open('aeon-garden', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('meadows');
    r.onsuccess = () => {
      const db = r.result, tx = db.transaction('meadows', 'readwrite');
      tx.objectStore('meadows').delete(LINK);
      tx.oncomplete = tx.onerror = tx.onabort = () => { db.close(); ok(); };
    };
    r.onerror = r.onblocked = () => ok();
  });
}

const until = (f, ms = 20000) => new Promise((ok, fail) => {
  const t0 = performance.now();
  (function poll() { let v; try { v = f(); } catch (e) { /* not yet */ } if (v) ok(v); else if (performance.now() - t0 > ms) fail(new Error('timed out')); else setTimeout(poll, 50); })();
});
const nextFrame = () => new Promise(ok => setTimeout(ok, 0));   // (not rAF: a hidden tab gets none)

// ------------------------------------------------------------------ running a frame's meadow into the summer

async function prepare(win) {
  await until(() => win.garden && win.garden.world && win.Sim);
  const S = win.Sim, g = win.garden, w = g.world;
  g.ui.speed = 0;
  while (w.tick < 300) { S.step(w); w.events.length = 0; }
  // The pond: a short scribble of the spade out in the open, well away from the water, by the most rabbits.
  const d = S.distanceToWater(w), lives = b => w.creatures.filter(c => c.alive && c.home === b).length;
  const SCRIB = [[-1.6, -1], [1.6, -1], [-1.6, 0], [1.6, 0], [-1.6, 1], [1.6, 1]];
  let pr = 12345, best = null;
  const rand = () => (pr = (pr * 1664525 + 1013904223) % 4294967296) / 4294967296;
  for (let t = 0; t < 6000; t++) {
    const x = Math.floor(rand() * S.W) + 0.5, y = Math.floor(rand() * S.H) + 0.5, i = Math.floor(y) * S.W + Math.floor(x);
    if (d[i] < 13 || x < 30 || x > 120 || y < 25 || y > 75) continue;
    const pts = SCRIB.map(([dx, dy]) => ({ x: x + dx, y: y + dy })), p = S.pondPlan(w, pts);
    if (!p.ok || p.lasting < 8) continue;
    const near = w.burrows.filter(b => (b.x - x) ** 2 + (b.y - y) ** 2 < 144).reduce((n, b) => n + lives(b), 0);
    if (!best || near > best.near) best = { x, y, pts, near };
  }
  const pond = best && S.digPond(w, best.pts);
  const summer = S.dryFrom(w) - (when === 'before' ? S.YEAR_DAYS * S.TPD : 0), target = summer + 3.5 * S.TPD;
  let atStart = null;
  while (w.tick < target) {
    for (let i = 0; i < 400 && w.tick < target; i++) { S.step(w); if (w.tick === summer) atStart = S.greenShare(w); }
    w.events.length = 0;
    await nextFrame();
  }
  win.document.querySelector('#time [data-speed="0"]').click();
  g.ui.follow = false;
  const [vw] = DEVICES[device];
  Object.assign(g.cam, { x: (best ? best.x : 75) - (device === 'phone' ? 0 : 7), y: (best ? best.y : 50) + (device === 'side' ? 2 : 0), zoom: device === 'desktop' ? 13 : 10, goal: null });
  return { S, w, pond: typeof pond === 'object' ? pond : null, atStart: atStart ?? S.greenShare(w), vw };
}

// ------------------------------------------------------------------ the placeholder HUD

const FEW = { rabbit: 4, fox: 3, bee: 4, crow: 3, owl: 2, otter: 2 };
function status(w, s) {
  const n = w.count[s], h = (w.history && w.history[s]) || [];
  if (!n) return h.some(v => v > 0) ? 'gone' : 'steady';
  if (n < FEW[s]) return 'endangered';
  const peak = Math.max(0, ...h.slice(-200));
  if (peak && n < 0.6 * peak) return 'fewer';
  if (h.length > 20 && n > 1.25 * h[Math.max(0, h.length - 30)]) return 'thriving';
  return 'steady';
}
const EMOJI = { rabbit: '🐇', fox: '🦊', bee: '🐝', crow: '🐦‍⬛', owl: '🦉', otter: '🦦' };
const NAMES = { rabbit: 'Rabbits', fox: 'Foxes', bee: 'Bees', crow: 'Crows', owl: 'Owls', otter: 'Otters' };
const WORD = { thriving: 'thriving', steady: 'steady', fewer: 'fewer than they were', endangered: 'only a few left', gone: 'gone from the meadow' };
const days = n => { const h = Math.round(n * 2) / 2; return (h === 1 ? '1 day' : `${Math.floor(h)}${h % 1 ? '½' : ''} days`); };

function hud(look, { S, w, pond, atStart }) {
  const phone = device !== 'desktop', kinds = S.KINDS.filter(s => s !== 'owl' || S.OWLS);
  const species = kinds.map(s => { const st = status(w, s); return `<span class="sp" data-st="${st}" title="${NAMES[s]} · ${WORD[st]}">${EMOJI[s]}<b>${w.count[s]}</b></span>`; }).join('');
  // the ribbon: a pip a season, from this one on, the Dry Year's summer parched
  const SEASON = S.SEASON_DAYS * S.TPD, cur = Math.floor(w.tick / SEASON), dry = (w.dryYear.year - 1) * 4 + 1;
  const into = (w.tick - cur * SEASON) / SEASON, n = phone ? 6 : 8;
  const pips = Array.from({ length: n }, (_, k) => {
    const i = cur + k, cls = ['pip', 's' + (i % 4), i === dry ? 'dry' : '', k === 0 ? 'now' : ''].join(' ');
    return `<span class="${cls}" style="${k === 0 ? `--p:${(into * 100).toFixed(0)}%` : ''}">${i === dry ? '<i>☀️</i>' : ''}</span>`;
  }).join('');
  const left = (S.dryTo(w) - w.tick) / S.TPD, ahead = Math.round((S.dryFrom(w) - w.tick) / SEASON);
  const line = S.dryStage(w) === 2 ? `<b>The Dry Year</b> · rain again in ${days(left)}` : `<b>The Dry Year</b> ${ahead <= 1 ? 'next season' : `in ${ahead} seasons`}`;
  const lineShort = S.dryStage(w) === 2 ? `Rain in ${days(left)}` : `Dry Year in ${ahead} seasons`;
  // the tasks
  const pondName = pond && w.waters[pond.id] ? w.waters[pond.id].name : 'your pond';
  const found = pond && pond.found;
  const tasks = [
    ['⛏️', 'Dig a pond the frogs can reach', found ? `Frogs found ${pondName}` : `Frogs ${S.frogsNear(w, pond.x, pond.y)} tiles off`, found ? 'done' : 'wait'],
    ['🌼', 'Sow flowers near a hive', `Bees fly up to ${S.FORAGE_RANGE} tiles from their hive`, 'next'],
    ['🌿', 'Plant a hedge by a warren', 'A rabbit hides in it from a fox', ''],
  ];
  const done = tasks.filter(t => t[3] === 'done').length;
  const head = S.dryStage(w) === 2 ? 'Get through the Dry Year' : 'Before the Dry Year';
  const taskList = tasks.map(([e, b, s, st]) => `<li class="${st}"><span class="e">${e}</span><span><b>${b}</b><small>${s}</small></span><span class="tick"></span></li>`).join('');
  const chip = tasks.map(([e, , , st]) => `<span class="ce ${st}">${e}</span>`).join('');
  // the green share
  const g = S.greenShare(w), gp = Math.round(g * 100), ref = Math.round(atStart * 100), low = g < 0.5 ? ' low' : '';
  const gauge = `<div class="gauge${low}" style="--v:${gp}%;--ref:${ref}%"><span class="g-l">🌱 Green</span><span class="g-v">${gp}%</span><span class="g-bar"><i></i><em></em></span><span class="g-ref">${ref}% when the summer began</span></div>`;
  const tools = [['look', '🔍', 'Look', 'L'], ['pond', '⛏️', 'Pond', 'D'], ['sow', '🌼', 'Sow', 'G'], ['hedge', '🌿', 'Hedge', 'H']]
    .map(([k, e, l, key]) => `<button class="mt${k === 'pond' ? ' on' : ''}" data-k="${k}"><span class="e">${e}</span><span class="l">${l}</span><kbd>${key}</kbd></button>`).join('');
  const tip = `<div id="m-tip" class="m-card"><h4 class="fr">⛏️ Dig a pond <kbd>D</kbd></h4>
    <p>Drag to paint water like a brush. A tap digs a small round one.</p>
    <ul><li><span>💧</span><span>The lower the ground, the longer it holds water. A wide one gets a deep middle.</span></li>
    <li class="dry"><span>☀️</span><span>Its banks stay green through the Dry Year, 3 tiles all round.</span></li>
    <li><span>🐸</span><span>Frogs come from up to 30 tiles off, within days.</span></li>
    <li><span>🐦‍⬛</span><span>Crows come down to the turned earth at once.</span></li></ul></div>`;
  const news = S.dryStage(w) === 2 ? '☀️ <b>The Dry Year.</b> The brook is down to pools, and the grass away from the water is turning to straw.'
    : `🐸 Frogs found <b>${pondName}</b>.`;
  const strip = phone ? `<div class="strip-row"><div class="portrait" style="background:#f1e3cc">🐇</div><div class="strip-text"><div class="strip-name">Juni <span class="sex">♀</span></div>
    <div class="strip-line">Grazing by ${pondName}</div><div class="meter strip-meter"><span style="width:62%"></span></div></div><span class="strip-more">›</span><button class="close">✕</button></div>` : '';
  if (look === 'plain') {
    const cap = t => `<span class="cap">${t}</span>`;
    const away = found ? '' : S.frogsNear(w, pond.x, pond.y);
    const plainTasks = [
      ['⛏️', 'Dig a pond', found ? 'Frogs moved in' : `→ frogs move in · ${away} tiles away`, found ? 'done' : 'wait'],
      ['🌼', 'Sow flowers', '→ bees come', 'next'],
      ['🌿', 'Plant a hedge', '→ a rabbit hides in it', ''],
    ];
    const list = plainTasks.map(([e, b, sm, st]) => `<li class="${st}"><span class="e">${e}</span><span><b>${b}</b><small>${sm}</small></span><span class="tick"></span></li>`).join('');
    const ribbon = S.dryStage(w) === 2 ? `${cap('Dry Year')} <b>${days(left)}</b> left` : `${cap('Dry Year')} in <b>${ahead} seasons</b>`;
    const trend = g < atStart - 0.03 ? '<i class="down">▼</i>' : g > atStart + 0.03 ? '<i class="up">▲</i>' : '';
    const gaugeP = `<div class="gauge${low}${phone ? ' mini' : ''}" style="--v:${gp}%;--ref:${ref}%">${phone ? '<span class="g-l">🌱</span>' : cap('🌱 Green')}<span class="g-v">${gp}%${phone ? '' : trend}</span><span class="g-bar"><i></i><em></em></span><span class="g-ref">was ${ref}%</span></div>`;
    const toolsP = [['look', '🔍', 'Look', 'L'], ['pond', '⛏️', 'Pond', 'D'], ['sow', '🌼', 'Flowers', 'G'], ['hedge', '🌿', 'Hedge', 'H']]
      .map(([k, e, l, key]) => `<button class="mt${k === 'pond' ? ' on' : ''}" data-k="${k}"><span class="e">${e}</span><span class="l">${l}</span><kbd>${key}</kbd></button>`).join('');
    const tipP = `<div id="m-tip" class="m-card"><h4 class="fr">⛏️ Pond <kbd>D</kbd></h4><p>Drag to dig</p>
      <ul class="stats"><li class="dry"><span>☀️</span><span>Green banks in the Dry Year</span><em>3 tiles</em></li>
      <li><span>🐸</span><span>Frogs move in</span><em>in days</em></li>
      <li><span>🐦‍⬛</span><span>Crows come</span><em>at once</em></li>
      <li><span>💧</span><span>Lasts all year</span><em>on low ground</em></li></ul></div>`;
    const newsP = S.dryStage(w) === 2 ? '☀️ <b>The Dry Year has begun.</b> No rain till autumn.' : `🐸 <b>Frogs moved into ${pondName}.</b>`;
    return { html: `<div id="m-top"></div><div id="m-foot"></div>
    <div id="m-species" class="m-card">${species}</div>
    <div id="m-tasks" class="m-card ${phone ? 'chip' : ''}">${phone ? `<span class="chip-row">${chip}<span class="fold">▾</span></span>`
      : `<div class="t-head">${cap('Tasks')}<span class="t-count">${done}/3</span><span class="fold">▴</span></div><ul>${list}</ul>`}</div>
    <div id="m-forecast"><div class="pips m-card">${pips}</div><div class="pip-line m-card">${ribbon}</div></div>
    <nav id="m-bar" class="m-card">${gaugeP}<span class="bar-sep"></span>${toolsP}</nav>
    ${phone ? '' : tipP}
    <div id="m-news"><div class="m-news m-card">${newsP}</div></div>`, strip };
  }
  return { html: `${look === 'brass' ? '<div id="m-top"></div><div id="m-foot"></div>' : ''}
    <div id="m-species" class="m-card">${species}</div>
    <div id="m-tasks" class="m-card ${phone ? 'chip' : ''}">${phone ? `<span class="chip-row">${chip}<span class="fold">▾</span></span>`
      : `<div class="t-head"><b class="fr">${head}</b><span class="t-count">${done} of 3</span><span class="fold">▴</span></div><ul>${taskList}</ul>`}</div>
    <div id="m-forecast"><div class="pips m-card">${pips}</div><div class="pip-line m-card">${phone ? lineShort : line}</div></div>
    <nav id="m-bar" class="m-card">${phone ? gauge.replace('class="gauge', 'class="gauge mini') : gauge}<span class="bar-sep"></span>${tools}</nav>
    ${phone ? '' : tip}
    <div id="m-news"><div class="m-news m-card">${news}</div></div>`, strip };
}

// ------------------------------------------------------------------ the looks

const BASE = `
  #meadow, #guide, #toolbar, #news, #daybreak { display: none !important; }
  .m-card { background: var(--paper, none) var(--card); box-shadow: var(--edge), var(--shadow); color: var(--ink); }
  #m-species { position: fixed; z-index: 4; display: flex; align-items: center; gap: 15px; padding: 0 16px; height: 50px; }
  #m-species .sp { position: relative; display: flex; align-items: center; gap: 5px; font-size: 20px; line-height: 1; }
  #m-species .sp b { font-size: 15.5px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #m-species .sp b::after { font-size: 10px; margin-left: 2px; vertical-align: 2px; }
  #m-species .sp[data-st="thriving"] b::after { content: '▲'; color: #5a9a3a; }
  #m-species .sp[data-st="fewer"] b::after { content: '▼'; color: #c46a2a; }
  #m-species .sp[data-st="endangered"] b { color: #c23b2b; }
  #m-species .sp[data-st="endangered"] b::after { content: '!'; font-size: 13px; font-weight: 900; color: #c23b2b; }
  #m-species .sp[data-st="gone"] { opacity: 0.45; text-decoration: line-through; }

  #m-tasks { position: fixed; z-index: 3; width: 310px; padding: 10px 10px 8px 14px; }
  .t-head { display: flex; align-items: baseline; gap: 8px; padding-right: 4px; }
  .t-head b { flex: 1; font-size: 17px; font-weight: 650; }
  .t-count { color: var(--muted); font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .fold { color: var(--muted); font-size: 12px; }
  #m-tasks ul { list-style: none; margin: 6px 0 0 -6px; padding: 0; }
  #m-tasks li { display: grid; grid-template-columns: 26px 1fr 14px; gap: 8px; align-items: start; padding: 6px 6px; border-radius: 10px; }
  #m-tasks li .e { font-size: 19px; text-align: center; line-height: 1.2; }
  #m-tasks li b { display: block; font-weight: 800; font-size: 14px; line-height: 1.25; }
  #m-tasks li small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; font-weight: 700; line-height: 1.3; }
  #m-tasks li.done b { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(90, 70, 40, 0.35); }
  #m-tasks li.done small { color: #4f7f3a; font-style: italic; }
  #m-tasks li.done .e { opacity: 0.6; }
  #m-tasks li.done .tick::before { content: '✓'; color: #4f8a35; font-weight: 900; }
  #m-tasks li.wait small::before { content: '⏳ '; }
  #m-tasks li.next { background: rgba(233, 138, 75, 0.13); }
  #m-tasks li.next .tick::before { content: '›'; color: var(--accent); font-weight: 900; font-size: 16px; }
  #m-tasks.chip { width: auto; padding: 0 10px; height: 38px; display: flex; align-items: center; }
  .chip-row { display: flex; align-items: center; gap: 7px; }
  .chip-row .ce { position: relative; font-size: 18px; }
  .chip-row .ce.done { opacity: 0.55; }
  .chip-row .ce.done::after { content: '✓'; position: absolute; right: -5px; bottom: -3px; font-size: 11px; font-weight: 900; color: #fff; background: #4f8a35; border-radius: 50%; width: 13px; height: 13px; display: grid; place-items: center; line-height: 1; }
  .chip-row .ce.next { filter: drop-shadow(0 0 3px rgba(233, 138, 75, 0.9)); }
  .chip-row .t-count { margin-left: 2px; }

  #m-forecast { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(var(--top) + var(--watch-d) + 26px);
    display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; }
  .pips { display: flex; align-items: center; gap: 3px; padding: 6px 9px; border-radius: 10px; }
  .pip { position: relative; width: 22px; height: 8px; border-radius: 4px; }
  .pip.s0 { background: #8fc45e; } .pip.s1 { background: #e8bb3c; } .pip.s2 { background: #d9733a; } .pip.s3 { background: #9dbcd8; }
  .pip.dry { width: 34px; height: 14px; border-radius: 5px; background: repeating-linear-gradient(135deg, #b4823f 0 3px, #dcb878 3px 6px); box-shadow: 0 0 0 1.5px #8a5a22; }
  .pip.dry i { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-style: normal; font-size: 10px; }
  .pip.now::after { content: ''; position: absolute; left: var(--p); top: -9px; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--ink); }
  .pip-line { padding: 3px 11px 4px; border-radius: 10px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
  .pip-line b { font-weight: 900; color: #8a4b12; }

  #m-bar { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: var(--bottom); display: flex; align-items: center; gap: 4px; padding: 7px 9px; border-radius: var(--radius); }
  .mt { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 84px; height: 64px; padding: 0;
    border: none; border-radius: 14px; background: transparent; font: inherit; color: inherit; }
  .mt .e { font-size: 30px; line-height: 1; }
  .mt .l { font-size: 14px; font-weight: 800; color: var(--muted); line-height: 1; }
  .mt kbd { position: absolute; top: 5px; right: 6px; font: 800 10.5px Nunito, sans-serif; color: var(--muted); padding: 0 4px; border-radius: 4px; background: rgba(0, 0, 0, 0.06); }
  .mt.on { background: var(--accent-soft); } .mt.on .l { color: var(--accent); }
  .bar-sep { width: 1px; align-self: stretch; margin: 8px 6px; background: var(--line); }
  .gauge { display: grid; grid-template-columns: auto auto; grid-template-rows: auto auto auto; column-gap: 8px; align-items: baseline; padding: 0 8px 0 10px; width: 210px; }
  .g-l { font-weight: 800; font-size: 14px; color: var(--muted); }
  .g-v { justify-self: end; font-weight: 900; font-size: 22px; font-variant-numeric: tabular-nums; }
  .g-bar { grid-column: 1 / -1; position: relative; height: 10px; margin: 4px 0 3px; border-radius: 99px; background: #e6d7b8; box-shadow: inset 0 1px 1px rgba(80, 60, 30, 0.25); }
  .g-bar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--v); border-radius: 99px; background: linear-gradient(90deg, #5f9346, #8fc45e); }
  .gauge.low .g-bar i { background: linear-gradient(90deg, #a7802f, #d9b25a); }
  .gauge.low .g-v { color: #8a4b12; }
  .g-bar em { position: absolute; top: -4px; bottom: -4px; left: var(--ref); width: 2px; margin-left: -1px; background: var(--ink); opacity: 0.55; border-radius: 1px; }
  .g-ref { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; font-weight: 700; }

  #m-tip { position: fixed; z-index: 6; width: 330px; padding: 12px 15px 13px; border-radius: 16px; left: 50%; bottom: calc(var(--bottom) + 94px); transform: translateX(-50%); }
  #m-tip::after { content: ''; position: absolute; left: 50%; bottom: -9px; margin-left: -9px; width: 18px; height: 18px; background: var(--card); transform: rotate(45deg); box-shadow: 3px 3px 4px rgba(70, 55, 25, 0.12); }
  #m-tip h4 { margin: 0; font-size: 19px; font-weight: 650; display: flex; align-items: center; gap: 6px; }
  #m-tip h4 kbd { margin-left: auto; font: 800 11px Nunito, sans-serif; color: var(--muted); padding: 1px 6px; border-radius: 5px; background: rgba(0, 0, 0, 0.06); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.15); }
  #m-tip p { margin: 3px 0 9px; font-size: 13.5px; line-height: 1.4; font-weight: 700; color: var(--muted); }
  #m-tip ul { list-style: none; margin: 0; padding: 9px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 6px; }
  #m-tip li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 13.5px; font-weight: 700; line-height: 1.35; }
  #m-tip li.dry { color: #8a4b12; font-weight: 800; }

  #m-news { position: fixed; z-index: 2; left: var(--left); bottom: calc(var(--bottom) + 94px); width: 330px; }
  .m-news { border-radius: 12px; padding: 6px 11px; font-size: 13.5px; line-height: 1.35; }

  /* phones */
  @media (max-width: 760px), (max-height: 500px) {
    #m-species { gap: 9px; padding: 0 11px; height: 44px; }
    #m-species .sp { flex-direction: column; gap: 2px; font-size: 16px; }
    #m-species .sp b { font-size: 12px; }
    #m-species .sp b::after { font-size: 8px; vertical-align: 1px; margin-left: 1px; }
    .pips { padding: 4px 6px; gap: 2px; }
    .pip { width: 14px; height: 6px; } .pip.dry { width: 22px; height: 11px; } .pip.dry i { font-size: 8px; }
    .pip-line { font-size: 12px; padding: 2px 8px 3px; }
    #m-forecast { top: calc(var(--top) + var(--watch-d) + 20px); gap: 3px; }
    #m-bar { gap: 2px; padding: 5px 6px; }
    .mt { width: 62px; height: 54px; gap: 3px; } .mt .e { font-size: 25px; } .mt .l { font-size: 11.5px; } .mt kbd { display: none; }
    .bar-sep { margin: 6px 2px; }
    .gauge.mini { width: 62px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0; height: 54px; }
    .gauge.mini .g-l { font-size: 0; } .gauge.mini .g-l::first-letter { font-size: 20px; }
    .gauge.mini .g-v { font-size: 15px; justify-self: auto; }
    .gauge.mini .g-bar { width: 44px; height: 5px; margin: 2px 0 0; }
    .gauge.mini .g-ref { display: none; }
    #m-news { width: calc(100% - var(--left) - var(--right)); bottom: calc(var(--bottom) + 76px); }
    #inspector.strip { position: fixed; left: var(--left); right: var(--right); width: auto !important; bottom: calc(var(--bottom) + 76px); }
    body.ins-strip #m-news { bottom: calc(var(--bottom) + 76px + 62px); }
  }
  @media (max-height: 500px) { #inspector.strip { left: auto; width: min(280px, 42vw) !important; top: calc(var(--top) + 56px); bottom: auto; } body.ins-strip #m-news { bottom: calc(var(--bottom) + 76px); } #m-news { width: min(400px, 40vw); } }
`;

// A. Storybook, anchored: the cards as now, but pinned where they meet the screen's edges.
const STORY = BASE + `
  #m-species { top: 0; left: 0; height: calc(env(safe-area-inset-top, 0px) + 56px); padding-top: env(safe-area-inset-top, 0px); padding-left: calc(18px + env(safe-area-inset-left, 0px)); border-radius: 0 0 18px 0; }
  #m-tasks { left: 0; top: 70px; border-radius: 0 18px 18px 0; padding-left: calc(18px + env(safe-area-inset-left, 0px)); }
  #hud-right { top: 0 !important; right: 0 !important; }
  #time { height: 56px; border-radius: 0 0 0 18px; padding: 0 14px 0 10px; }
  #m-bar { bottom: 0; border-radius: 20px 20px 0 0; padding-bottom: calc(7px + env(safe-area-inset-bottom, 0px)); }
  #m-tip { bottom: 96px; }
  #m-news { bottom: 96px; }
  @media (max-width: 760px), (max-height: 500px) {
    #m-species { height: 52px; padding-left: 12px; padding-right: 12px; }
    #time { height: 52px; padding: 0 8px; }
    #m-tasks.chip { top: 60px; padding-left: 12px; border-radius: 0 14px 14px 0; }
    #m-bar { padding-bottom: 6px; }
    #m-news, #inspector.strip { bottom: 76px !important; }
    body.ins-strip #m-news { bottom: 138px !important; }
  }
  @media (max-height: 500px) { #inspector.strip { top: 60px; bottom: auto !important; } body.ins-strip #m-news { bottom: 76px !important; } }
`;

// B. Brass frame: a parchment bar along the top and one along the bottom, each with a brass rule like the watch's
// case; the watch hangs from the top bar like a medallion, and the cards under it take a brass edge too.
const BRASS = BASE + `
  :root { --brass: linear-gradient(180deg, #f6d98c, #d9a441 45%, #8a5e22); }
  #m-top, #m-foot { position: fixed; left: 0; right: 0; z-index: 3; background: var(--paper, none) var(--card); }
  #m-top { top: 0; height: 58px; box-shadow: 0 6px 16px rgba(70, 55, 25, 0.22); }
  #m-top::after, #m-foot::before { content: ''; position: absolute; left: 0; right: 0; height: 6px; background: var(--brass); box-shadow: inset 0 -1px 0 rgba(90, 55, 15, 0.55), inset 0 1px 0 rgba(255, 240, 200, 0.6); }
  #m-top::after { bottom: -6px; }
  #m-foot { bottom: 0; height: 84px; box-shadow: 0 -6px 16px rgba(70, 55, 25, 0.22); }
  #m-foot::before { top: -6px; transform: scaleY(-1); }
  #m-species { top: 4px; left: 6px; background: none; box-shadow: none; }
  #hud-right { top: 6px !important; right: 8px !important; }
  #time { background: none !important; box-shadow: none !important; }
  #watch { z-index: 4; top: 4px !important; }
  #m-tasks { left: var(--left); top: 76px; border-radius: 0 0 16px 16px; }
  #m-tasks::before, #m-tip::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--brass); border-radius: 2px 2px 0 0; }
  #m-tasks:not(.chip) { padding-top: 13px; }
  #m-bar { left: 0; right: 0; bottom: 0; transform: none; justify-content: center; gap: 8px; height: 84px; background: none; box-shadow: none; padding: 0 10px; border-radius: 0; }
  .mt { background: linear-gradient(180deg, #fffaf0, #f1e5c9); box-shadow: inset 0 0 0 1.5px #d2b06a, 0 2px 0 #a8742a; height: 62px; }
  .mt.on { background: linear-gradient(180deg, #fff1df, #fbd9b9); box-shadow: inset 0 0 0 2px #d9a441, 0 2px 0 #a8742a; }
  #m-bar .gauge { position: absolute; left: calc(18px + env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); width: 230px; }
  .bar-sep { display: none; }
  #m-tip { bottom: 104px; border-radius: 0 0 16px 16px; padding-top: 15px; }
  #m-news { bottom: 104px; }
  .pips, .pip-line { box-shadow: var(--edge), 0 4px 12px rgba(70, 55, 25, 0.18); }
  @media (max-width: 760px), (max-height: 500px) {
    #m-top { height: 52px; }
    #m-species { top: 4px; left: 2px; height: 44px; }
    #hud-right { top: 4px !important; right: 4px !important; }
    #m-tasks.chip { top: 64px; left: 10px; border-radius: 0 0 12px 12px; }
    #m-foot { height: 68px; }
    #m-bar { height: 68px; padding: 0 6px; gap: 5px; }
    .mt { height: 52px; width: 60px; }
    #m-bar .gauge.mini { position: static; transform: none; width: 60px; height: 52px; }
    #m-news, #inspector.strip { bottom: 82px !important; }
    body.ins-strip #m-news { bottom: 144px !important; }
  }
  @media (max-height: 500px) { #inspector.strip { top: 64px; bottom: auto !important; } body.ins-strip #m-news { bottom: 82px !important; } }
`;

// B in plain words: small brass capitals name each part, the numbers are big, and a line says one thing.
const PLAIN = `
  .cap { text-transform: uppercase; letter-spacing: 0.11em; font-size: 11.5px; font-weight: 900; color: #8a5e22; }
  .pip-line { font-size: 13px; font-weight: 700; display: flex; align-items: baseline; gap: 6px; padding: 3px 12px 5px; }
  .pip-line b { font-size: 17px; font-weight: 900; color: var(--ink); }
  .t-head { align-items: center; padding: 1px 4px 0 0; }
  .t-head .cap { flex: 1; }
  .t-head .t-count { font-size: 14px; color: var(--ink); font-weight: 900; }
  #m-tasks { width: 236px; }
  #m-tasks li b { font-size: 15px; }
  #m-tasks li small { font-size: 13px; }
  #m-tasks li.wait small::before { content: '⏳ '; }
  #m-tasks li.done small::before { content: '🐸 '; font-style: normal; }
  .gauge { grid-template-columns: 1fr auto; row-gap: 0; }
  .gauge .cap { align-self: center; }
  .g-v i { font-style: normal; font-size: 13px; margin-left: 3px; vertical-align: 3px; }
  .g-v i.down { color: #c46a2a; } .g-v i.up { color: #5a9a3a; }
  .g-ref { justify-self: start; margin-left: calc(var(--ref) - 18px); font-size: 11px; font-weight: 800; }
  #m-tip { width: 290px; }
  #m-tip h4 { font-size: 20px; }
  #m-tip p { margin: 1px 0 8px; font-size: 13px; color: var(--muted); }
  #m-tip ul.stats li { grid-template-columns: 22px 1fr auto; align-items: baseline; font-size: 14px; }
  #m-tip ul.stats em { font-style: normal; font-size: 12.5px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  #m-tip ul.stats li.dry em { color: #8a4b12; }
  .m-news { font-size: 14px; }
  @media (max-width: 760px), (max-height: 500px) {
    .pip-line { font-size: 11px; padding: 2px 9px 3px; gap: 4px; } .pip-line b { font-size: 14px; } .pip-line .cap { font-size: 10px; }
    .gauge.mini .g-l { font-size: 20px; }
    .gauge.mini .g-ref { display: block; margin: 1px 0 0; font-size: 9.5px; color: var(--muted); }
  }
`;

// ------------------------------------------------------------------ the sheet

async function build(look, cap, sub) {
  const [W, H] = DEVICES[device];
  const room = only ? Math.min(innerWidth - 48, 1600) : (innerWidth - 48 - 18 * (SHOWN.length - 1)) / SHOWN.length;
  const s = Math.min(only ? 1 : device === 'phone' ? 1 : 0.8, room / W);
  const fig = document.createElement('figure');
  fig.innerHTML = `<figcaption>${cap}<small>${sub}</small></figcaption><div class="box" style="width:${Math.round(W * s)}px;height:${Math.round(H * s)}px">
    <iframe width="${W}" height="${H}" style="width:${W}px;height:${H}px;transform:scale(${s})" src="index.html?seed=31&keep&dry=${when === 'before' ? 2 : 1}"></iframe><div class="wait">Running the meadow into the summer…</div></div>`;
  document.querySelector('#grid').append(fig);
  const ifr = fig.querySelector('iframe');
  await new Promise(ok => ifr.addEventListener('load', ok, { once: true }));
  const win = ifr.contentWindow, data = await prepare(win);
  if (look !== 'today') {
    const doc = win.document, st = doc.createElement('style');
    st.textContent = look === 'brass' ? BRASS : look === 'plain' ? BRASS + PLAIN : STORY;
    doc.head.append(st);
    const { html, strip } = hud(look, data), box = doc.createElement('div');
    box.innerHTML = html;
    doc.body.append(...box.childNodes);
    if (strip) {
      const ins = doc.querySelector('#inspector');
      ins.className = 'card open strip'; ins.innerHTML = strip;
      doc.body.classList.add('inspecting', 'ins-strip');
    }
  }
  const tip = win.document.querySelector('#m-tip'), btn = win.document.querySelector('.mt[data-k="pond"]');
  if (tip && btn) { const r = btn.getBoundingClientRect(); tip.style.left = (r.left + r.width / 2) + 'px'; }   // over the Pond button, its arrow on it
  fig.querySelector('.wait').classList.add('gone');
}

(async () => {
  await forget();
  for (const [k, cap, sub] of only ? [only] : SHOWN) await build(k, cap, sub);
  document.title = 'Keeper HUD mock: ready';
})();
</script>
